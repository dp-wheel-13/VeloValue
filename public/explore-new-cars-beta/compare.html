<html lang="en">
<head>
  <script type="text/javascript" src="https://embeds.iubenda.com/widgets/2a4fd3b9-c13e-4d27-977b-c7dc1f33c094.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VeloValue – Compare Cars</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
  :root { --bg:#000; --text:#fff; --accent:#1db954; --radius-xl:18px; --radius-lg:14px; --radius-md:10px; --shadow-1:0 8px 24px rgba(0,0,0,.45); --shadow-2:0 18px 50px rgba(0,0,0,.55); --header-offset:0px; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:Inter,system-ui,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.35; padding-top: var(--header-offset); }
  a{ color:var(--text); text-decoration:none; }

  /* Page */
  .container{ width:min(1200px,94vw); margin:0 auto; padding:20px 0 40px; }
  .title-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .title{ font-size:22px; font-weight:900; }
  .muted{ opacity:.75; }
  .btn{ padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:transparent; color:var(--text); cursor:pointer; font-weight:800; }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.primary{ background:var(--accent); color:var(--bg); border-color:#178b42; }
  .btn.primary:hover{ filter:brightness(1.05); }

  /* Compare grid */
  .panel{ background:#101820; border:1px solid rgba(255,255,255,.12); border-radius:var(--radius-xl); box-shadow:var(--shadow-1); }
  .table{ overflow:auto; }
  .grid{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,1fr); gap:1px; }
  .col{ background:rgba(255,255,255,.02); border-right:1px solid rgba(255,255,255,.08); min-width:240px; }
  .head{ padding:12px; border-bottom:1px solid rgba(255,255,255,.12); display:grid; gap:8px; text-align:center; }
  .img{ width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#0f0f0f; }
  .name{ font-weight:900; }
  .sub{ font-size:12px; opacity:.85; }
  .row{ display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.06); }
  .k{ opacity:.8; }
  .v{ font-weight:700; text-align:right; }
  .col .actions{ display:flex; gap:8px; justify-content:center; padding:10px 12px; }

  .empty{ padding:30px; text-align:center; opacity:.75; }

  /* Chips line */
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .chip{ display:inline-flex; gap:8px; align-items:center; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.2); }
  .chip .x{ background:transparent; border:0; color:var(--text); font-weight:800; cursor:pointer; }

  /* Toast */
  .toast-wrap{ position:fixed; right:16px; bottom:16px; display:grid; gap:10px; z-index:2000; }
  .toast{ background:var(--accent); color:var(--bg); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow-2); transform:translateY(10px); opacity:0; animation:toast-in .2s ease forwards; font-weight:800; }
  @keyframes toast-in{ to{ transform:translateY(0); opacity:1; } }
</style>

<!-- ✅ FULL VERSION A — FINAL RESPONSIVE HEADER -->
<style>
  header, header * {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 2rem;
    background: rgba(0,0,0,0.6);
    border-bottom: 1px solid #333;
    z-index: 2000;
    backdrop-filter: blur(6px);
  }

  .header-left { display:flex; align-items:center; gap:15px; }
  .header-right { display:flex; align-items:center; gap:15px; }

  header h1 a {
    font-size:1.8rem;
    font-weight:800;
    color:#fff;
    text-decoration:none;
  }

  /* Desktop nav */
  nav.desktop-nav { display:flex; gap:20px; }
  nav.desktop-nav a {
    color:#fff;
    font-weight:600;
    font-size:16px;
    text-decoration:none;
    white-space:nowrap;
  }
  nav.desktop-nav a:hover { text-decoration:underline; }

  /* Language select */
  .language-select { position:relative; }
  .language-select select {
    appearance:none;
    background:#111; color:#fff;
    border:1px solid #333; border-radius:6px;
    padding:6px 30px 6px 10px;
    font-size:0.9rem;
    cursor:pointer;
  }

  /* Auth button */
  #authSection .text-btn {
    display:inline-flex; background:#fff; color:#000;
    border:none; border-radius:999px;
    padding:8px 16px; font-weight:600;
    cursor:pointer;
    align-items:center; justify-content:center;
  }

  #authSection .icon-btn { display:none; }

  /* Wishlist / Compare buttons */
  .wishlist { position:relative; }

  .icon-btn {
    position:relative;
    background:transparent;
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
    width:40px; height:40px;
    border-radius:50%;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:border-color .2s;
  }
  .icon-btn:hover { border-color:var(--accent); }

  .icon-btn svg {
    width:18px; height:18px;
    stroke:currentColor;
    fill:transparent;
    stroke-width:1.8;
  }

  .icon-btn .badge {
    position:absolute;
    top:-6px; right:-6px;
    min-width:18px;
    height:18px;
    padding:0 5px;
    display:none;
    align-items:center; justify-content:center;
    background:var(--accent);
    color:#000;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
  }

  .wishlist .dropdown {
    position:absolute;
    right:0;
    top:calc(100% + 10px);
    width:320px;
    max-height:420px;
    background:#101820;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    box-shadow:var(--shadow-2);
    display:none;
    overflow:hidden;
  }

  .wishlist.open .dropdown { display:block; }

  .dropdown-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-bottom:1px solid rgba(255,255,255,.1);
  }

  .dropdown-list {
    padding:10px;
    display:grid;
    gap:10px;
    max-height:360px;
    overflow:auto;
  }

  .wish-item {
    display:grid; grid-template-columns:44px 1fr auto;
    gap:10px; align-items:center;
    padding:8px; border-radius:10px;
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.08);
  }
  .wish-item img {
    width:44px; height:44px;
    object-fit:cover;
    border-radius:8px;
  }

  /* Mobile menu panel */
  .hamburger {
    font-size:1.8rem;
    background:none;
    border:none;
    color:#fff;
    cursor:pointer;
    display:none;
    align-items:center; justify-content:center;
    z-index:2200;
    width:40px; height:40px;
  }

  .menu {
    position: fixed;
    top:0; left:-300px;
    width:300px; height:100vh;
    background: rgba(17,17,17,0.95);
    border-right:1px solid rgba(255,255,255,0.12);
    padding:3rem 2rem;
    display:flex;
    flex-direction:column;
    gap:2rem;
    transition:left 0.3s ease;
    z-index:2100;
    backdrop-filter:blur(10px);
    border-radius:0 1rem 1rem 0;
  }
  .menu.active { left:0; }
  .menu a {
    color:#fff;
    font-size:1.6rem;
    font-weight:800;
    text-decoration:none;
  }

  .menu-overlay {
    position:fixed; inset:0;
    background: rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
    z-index:2050;
  }
  .menu-overlay.active {
    opacity:1;
    pointer-events:auto;
  }

  /* TAB VIEW + MOBILE BREAKPOINTS */
  @media(max-width:1024px){
    nav.desktop-nav{display:none;}
    .hamburger{display:flex;}

    .hamburger { position: relative; font-size: 0; }
    .hamburger::before, .hamburger::after {
      content: ""; position: absolute; left: 50%;
      width: 22px; height: 2px; background: currentColor;
      transform: translateX(-50%);
      transition: transform .25s ease, top .25s ease, opacity .2s ease;
    }
    .hamburger::before { top: calc(50% - 6px); }
    .hamburger::after  { top: calc(50% + 6px); }

    .hamburger {
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 22px 2px;
    }
    .hamburger.is-active { background-size: 0 0; }
    .hamburger.is-active::before {
      top: 50%; transform: translateX(-50%) rotate(45deg);
    }
    .hamburger.is-active::after  {
      top: 50%; transform: translateX(-50%) rotate(-45deg);
    }
  }

  /* MOBILE BREAKPOINT */
  @media(max-width:768px){
    #authSection .text-btn{display:none;}

    #authSection .icon-btn{
      display:inline-flex;
      align-items:center; justify-content:center;
      width:40px; height:40px;
      border-radius:50%;
      font-size:1.2rem;
      background:#fff; color:#000;
      border:none;
      cursor:pointer;
      transition:transform 0.2s ease;
    }

    #authSection .icon-btn:active{transform:scale(0.95);}

    .language-select{
      width:40px; height:40px;
      border-radius:50%;
      background:#111;
      border:1px solid #fff;
      display:flex; align-items:center; justify-content:center;
      position: relative;
    }
    .language-select::before{
      content:"";
      font-size:1.2rem;
      color:#fff;
      position:absolute;
    }
    .language-select select{
      opacity:0;
      position:absolute;
      inset:0;
      width:100%; height:100%;
      cursor:pointer;
    }
  }

  /* ✅ FINAL MOBILE SHRINK FIX */
  @media (max-width: 768px) {
    header {
      padding: 0.5rem 0.8rem !important;
      height: 60px;
      gap: 10px;
    }

    .header-left,
    .header-right {
      gap: 10px !important;
    }

    .hamburger {
      width: 30px !important;
      height: 30px !important;
    }
    .hamburger::before,
    .hamburger::after {
      width: 16px !important;
    }
    .hamburger {
      background-size: 16px 2px !important;
    }

    header h1 a {
      font-size: 1.3rem !important;
    }

    #authSection .icon-btn {
      width: 30px !important;
      height: 30px !important;
      font-size: 1rem !important;
    }

    .language-select {
      width: 30px !important;
      height: 30px !important;
      border-radius: 50% !important;
    }
    .language-select::before {
      font-size: 1rem !important;
    }

    .wishlist .icon-btn {
      width: 30px !important;
      height: 30px !important;
    }
    .wishlist .icon-btn svg {
      width: 14px !important;
      height: 14px !important;
    }
    .wishlist .badge {
      top: -4px !important;
      right: -4px !important;
      min-width: 14px !important;
      height: 14px !important;
      font-size: 9px !important;
    }

    .header-right {
      overflow: visible;
      flex-shrink: 1;
    }
  }

  /* ✅ TAB-VIEW GRID OVERRIDE */
  @media (max-width: 700px) {
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      max-width: none !important;
      margin: 0 !important;
      gap: 10px;
    }
    .grid .col {
      min-width: 0 !important;
      max-width: none !important;
      margin-inline: 0 !important;
    }
  }

</style>

  <!-- Main -->
  <main class="container">

  <div id="toastWrap" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Compare page data/storage helpers
    const CMP_KEY = 'vv_compare_ids';
    const META_KEY = 'vv_compare_meta';
    const $ = (s, r=document) => r.querySelector(s);
    const toast = (msg) => {
      const w = $('#toastWrap'); const el = document.createElement('div');
      el.className='toast'; el.textContent = msg; w.appendChild(el);
      setTimeout(()=>{ el.style.transition='opacity .2s, transform .2s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; },1200);
      setTimeout(()=> w.contains(el) && w.removeChild(el),1500);
    };

    function getIdsFromURL(){
      const p = new URLSearchParams(location.search);
      const ids = p.get('ids');
      if(!ids) return null;
      return ids.split(',').map(s=>s.trim()).filter(Boolean);
    }
    function loadIds(){
      const fromUrl = getIdsFromURL();
      if (fromUrl && fromUrl.length) return fromUrl;
      try { return JSON.parse(localStorage.getItem(CMP_KEY) || '[]'); } catch { return []; }
    }
    function saveIds(ids){
      localStorage.setItem(CMP_KEY, JSON.stringify(ids));
      const p = new URLSearchParams(location.search);
      if (ids.length) p.set('ids', ids.join(',')); else p.delete('ids');
      history.replaceState(null,'', `${location.pathname}?${p.toString()}`);
    }
    function loadMeta(){
      try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch { return {}; }
    }
    function saveMeta(meta){ localStorage.setItem(META_KEY, JSON.stringify(meta)); }

    function formatEUR(n){ return n==null ? '—' : '€'+Number(n).toLocaleString(); }

    function removeId(id){
      const ids = loadIds().filter(x => x !== id);
      saveIds(ids);
      render();
      toast('Removed');
    }
    function clearAll(){
      saveIds([]);
      render();
      toast('Cleared');
    }

    function chipHTML(id, meta){
      const name = meta?.brand ? `${meta.brand} ${meta.model||''}`.trim() : id;
      return `<span class="chip" data-id="${id}">${name} <button class="x" aria-label="Remove">×</button></span>`;
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function colHTML(meta, id){
      const safe = value => escapeHTML(value == null || value === '' ? '—' : value);
      const name = `${meta.brand||''} ${meta.model||''}`.trim() || id;
      const title = meta.variantName ? `${name} — ${meta.variantName}` : name;
      const sub = [meta.body, meta.fuel].filter(Boolean).join(' • ');
      const t = meta.gear ? (meta.gear === 'Auto' ? 'Automatic' : meta.gear) : '—';
      const power = meta.powerHp != null
        ? `${meta.powerHp} HP${meta.powerKw != null ? ` / ${meta.powerKw} kW` : ''}`
        : '—';
      const acceleration = meta.zeroTo100 != null ? `${meta.zeroTo100} s` : '—';
      const topSpeed = meta.topSpeed != null ? `${meta.topSpeed} km/h` : '—';
      const consumption = meta.fuelConsumption != null ? `${meta.fuelConsumption} L/100 km` : '—';
      const viewUrl = meta.generationId
        ? `cars.html?code=${encodeURIComponent(meta.generationId)}&variant=${encodeURIComponent(meta.variantIndex ?? "")}`
        : `cars.html?id=${encodeURIComponent(id)}`;
      const row = (label, value) =>
        `<div class="row"><span class="k">${escapeHTML(label)}</span><span class="v">${safe(value)}</span></div>`;

      return `
        <div class="col" data-id="${escapeHTML(id)}">
          <div class="head">
            ${meta.img ? `<img class="img" src="${escapeHTML(meta.img)}" alt="${escapeHTML(title)}">` : `<div class="img" style="display:grid;place-items:center;opacity:.6">No image</div>`}
            <div class="name">${escapeHTML(title)}</div>
            <div class="sub">${escapeHTML(sub || '—')}</div>
            <div class="actions">
              <a class="btn" href="${viewUrl}">View</a>
              <button class="btn" data-remove="${escapeHTML(id)}">Remove</button>
            </div>
          </div>
          ${row('Variant', meta.variantName)}
          ${row('Price', meta.price == null ? '—' : formatEUR(meta.price))}
          ${row('Body', meta.body)}
          ${row('Fuel', meta.fuel)}
          ${row('Power', power)}
          ${row('Torque', meta.torqueNm != null ? `${meta.torqueNm} Nm` : '—')}
          ${row('Transmission', t)}
          ${row('Drivetrain', meta.drivetrain)}
          ${row('0–100 km/h', acceleration)}
          ${row('Top speed', topSpeed)}
          ${row('Fuel consumption', consumption)}
          ${row('Length', meta.lengthMm != null ? `${meta.lengthMm} mm` : '—')}
          ${row('Width', meta.widthMm != null ? `${meta.widthMm} mm` : '—')}
          ${row('Height', meta.heightMm != null ? `${meta.heightMm} mm` : '—')}
          ${row('Wheelbase', meta.wheelbaseMm != null ? `${meta.wheelbaseMm} mm` : '—')}
          ${row('Kerb weight', meta.kerbWeightKg != null ? `${meta.kerbWeightKg} kg` : '—')}
          ${row('Rating', meta.rating)}
        </div>`;
    }
    function render(){
      const ids = loadIds();
      const meta = loadMeta();
      const chips = $('#chips');
      const grid = $('#grid');
      const empty = $('#emptyState');
      const count = $('#countLine');

      if (!ids.length) {
        chips.innerHTML = '';
        grid.style.display = 'none';
        empty.style.display = 'block';
        count.textContent = '0 selected';
        return;
      }

      chips.innerHTML = ids.map(id => chipHTML(id, meta[id])).join('');
      grid.innerHTML = ids.map(id => colHTML(meta[id] || {}, id)).join('');
      grid.style.display = 'grid';
      empty.style.display = 'none';
      count.textContent = `${ids.length} selected`;

      // Remove handlers
      chips.onclick = (e)=>{
        const x = e.target.closest('.x'); if(!x) return;
        const id = x.closest('.chip').dataset.id;
        removeId(id);
      };
      grid.onclick = (e)=>{
        const btn = e.target.closest('[data-remove]'); if(!btn) return;
        removeId(btn.getAttribute('data-remove'));
      };
    }

    // Init
    (function init(){
      $('#backBtn').addEventListener('click', ()=>{
        const url = new URL('/explore-new-cars-beta/explorenewcars.html', location.href);
        location.href = url.toString();
      });
      $('#clearBtn').addEventListener('click', clearAll);
      render();
    })();
  </script>

  <!-- Unified header JS -->
  <script>
    (function(){
      const $ = (s, r=document)=>r.querySelector(s);
      const hamburger = $(".hamburger");
      const menu = $("#hamburgerMenu");
      const overlay = document.querySelector(".menu-overlay");

      function openMenu(){ hamburger.setAttribute("aria-expanded","true"); hamburger.classList.add("is-active"); if (window.innerWidth>1024) hamburger.textContent="✕"; menu.classList.add("active"); overlay.classList.add("active"); menu.setAttribute("aria-hidden","false"); }
      function closeMenu(){ hamburger.setAttribute("aria-expanded","false"); hamburger.classList.remove("is-active"); if (window.innerWidth>1024) hamburger.textContent="☰"; menu.classList.remove("active"); overlay.classList.remove("active"); menu.setAttribute("aria-hidden","true"); }
      function toggleMenu(){ menu.classList.contains("active") ? closeMenu() : openMenu(); }
      if (hamburger){ hamburger.addEventListener("click", toggleMenu); }
      if (overlay){ overlay.addEventListener("click", closeMenu); }
      window.addEventListener("resize", ()=>{ if(window.innerWidth>1024 && menu.classList.contains("active")) closeMenu(); });

      // Auth button swap
      const authSection = document.getElementById("authSection");
      function updateAuthButton(){
        if(!authSection) return;
        if(window.innerWidth <= 768){
          authSection.innerHTML = `<button class="icon-btn" onclick="window.location.href='login.html'"><img src="/icons/user.png" alt="" class="user-icon"></button>`;
        } else {
          authSection.innerHTML = `<button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>`;
        }
      }
      updateAuthButton();
      window.addEventListener("resize", updateAuthButton);

      // Offset body for fixed header
      function syncHeaderOffset(){
        const header = document.querySelector('header');
        if (!header) return;
        const h = header.offsetHeight;
        document.documentElement.style.setProperty('--header-offset', h + 'px');
      }
      window.addEventListener('load', syncHeaderOffset);
      window.addEventListener('resize', syncHeaderOffset);

      // Header dropdowns (Wishlist)
      (function(){
        const wrap = document.getElementById('wishlist');
        const btn = document.getElementById('wishlistBtn');
        const badge = document.getElementById('wishlistBadge');
        const items = document.getElementById('wishlistItems');
        const clearBtn = document.getElementById('clearWishlist');

        if (!wrap || !btn || !badge || !items) return;

        let wishlistCars = [];
        let wishlistReady = false;
        let wishlistBusy = false;

        function renderWishlist(){
          badge.textContent = wishlistCars.length;
          badge.style.display = wishlistCars.length ? 'grid' : 'none';
          items.replaceChildren();

          if (!wishlistCars.length) {
            const empty = document.createElement('div');
            empty.className = 'dropdown-empty';
            empty.style.cssText = 'padding:20px;text-align:center;opacity:.75;';
            empty.textContent = 'Your wishlist is empty.';
            items.appendChild(empty);
            return;
          }

          wishlistCars.forEach(car => {
            const row = document.createElement('div');
            row.className = 'wish-item';
            row.dataset.id = car.carId;

            if (car.img) {
              const img = document.createElement('img');
              img.src = car.img;
              img.alt = [car.brand, car.model].filter(Boolean).join(' ');
              row.appendChild(img);
            }

            const info = document.createElement('div');
            info.className = 'wish-meta';

            const name = document.createElement('div');
            name.className = 'wish-title';
            name.textContent = [car.brand, car.model].filter(Boolean).join(' ') || 'Saved car';

            const details = document.createElement('div');
            details.className = 'wish-sub';
            const price = Number(car.price);
            const priceText = car.price != null && car.price !== '' && Number.isFinite(price)
              ? new Intl.NumberFormat('it-IT', {
                  style: 'currency',
                  currency: 'EUR',
                  maximumFractionDigits: 0
                }).format(price)
              : 'Price unavailable';

            details.textContent = [car.generation || car.body, priceText]
              .filter(Boolean)
              .join(' � ');

            info.appendChild(name);
            info.appendChild(details);
            row.appendChild(info);

            const remove = document.createElement('button');
            remove.className = 'remove-btn';
            remove.type = 'button';
            remove.dataset.remove = car.carId;
            remove.textContent = 'Remove';
            remove.setAttribute('aria-label', 'Remove ' + name.textContent + ' from wishlist');
            row.appendChild(remove);

            items.appendChild(row);
          });
        }

        async function loadWishlist(){
          try {
            const authResponse = await fetch('/api/user-status', {
              method: 'GET',
              credentials: 'include'
            });

            if (!authResponse.ok) {
              throw new Error('Could not verify login status');
            }

            const auth = await authResponse.json();

            if (!auth.loggedIn) {
              wishlistCars = [];
              wishlistReady = true;
              renderWishlist();
              return;
            }

            const response = await fetch('/api/wishlist', {
              method: 'GET',
              credentials: 'include'
            });

            const data = await response.json();

            if (response.status === 401) {
              wishlistCars = [];
              wishlistReady = true;
              renderWishlist();
              return;
            }

            if (!response.ok || !data.success) {
              throw new Error(data.message || 'Could not load Wishlist');
            }

            wishlistCars = Array.isArray(data.cars) ? data.cars : [];
            wishlistReady = true;
            renderWishlist();
          } catch (error) {
            console.error('Compare page Wishlist load failed:', error);
          }
        }

        async function removeWishlistCar(id){
          if (wishlistBusy || !id) return;
          wishlistBusy = true;

          try {
            const response = await fetch('/api/wishlist/' + encodeURIComponent(id), {
              method: 'DELETE',
              credentials: 'include'
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
              throw new Error(data.message || 'Could not remove car');
            }

            wishlistCars = Array.isArray(data.cars) ? data.cars : [];
            renderWishlist();
          } catch (error) {
            console.error('Compare page Wishlist removal failed:', error);
          } finally {
            wishlistBusy = false;
          }
        }

        async function clearWishlist(){
          if (wishlistBusy || !wishlistCars.length) return;
          wishlistBusy = true;

          try {
            const response = await fetch('/api/wishlist', {
              method: 'DELETE',
              credentials: 'include'
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
              throw new Error(data.message || 'Could not clear Wishlist');
            }

            wishlistCars = Array.isArray(data.cars) ? data.cars : [];
            renderWishlist();
          } catch (error) {
            console.error('Compare page Wishlist clear failed:', error);
          } finally {
            wishlistBusy = false;
          }
        }

        btn.addEventListener('click', ()=>{
          const open = wrap.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (open && !wishlistReady) loadWishlist();
        });

        items.addEventListener('click', (e)=>{
          const removeBtn = e.target.closest('[data-remove]');
          if (removeBtn) removeWishlistCar(removeBtn.dataset.remove);
        });

        if (clearBtn) {
          clearBtn.addEventListener('click', clearWishlist);
        }

        document.addEventListener('click', (e)=>{
          if (!wrap.contains(e.target)) {
            wrap.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
          }
        });

        document.addEventListener('keydown', (e)=>{
          if (e.key === 'Escape') {
            wrap.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
          }
        });

        loadWishlist();
      })();
})();
  </script>

  <script src="/js/auth.js"></script>
  <script src="js/translate.js"></script>
<script src="/js/app-navigation.js"></script>
</body>
</html>
