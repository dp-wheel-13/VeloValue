
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b09" />
  <title>Create Account - VeloValue</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/register.css" />

  <script src="https://embeds.iubenda.com/widgets/2a4fd3b9-c13e-4d27-977b-c7dc1f33c094.js"></script>
</head>

<body>
  <video autoplay muted loop playsinline id="bg-video">
    <source src="/Multimedia/login%20video.mp4" type="video/mp4" />
  </video>

  <div class="velovalue-header" onclick="window.location.href='/homepage.html'" role="link" tabindex="0">
    VeloValue
  </div>

  <main class="login-container">
    <form id="registerForm" class="login-form" novalidate>
      <h2>Create Account</h2>

      <button type="button" class="social-btn" id="googleSignup">
        Continue with Google
      </button>

      <button type="button" class="social-btn" disabled>
        Continue with Facebook (Coming Soon)
      </button>

      <button type="button" class="social-btn" disabled>
        Continue with Apple (Coming Soon)
      </button>

      <div class="divider"><span>or</span></div>

      <label for="fullname">Full Name</label>
      <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Your full name"
        autocomplete="name"
        maxlength="100"
        required
      />

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        maxlength="254"
        required
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="8"
        required
      />

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
        minlength="8"
        required
      />

      <p id="formMessage" role="alert" aria-live="polite"
         style="color:#ff7777;font-size:.85rem;margin-top:12px;min-height:20px;"></p>

      <button type="submit" id="registerSubmit">Create Account</button>

      <p class="signup-link">
        Already have an account?
        <a id="loginLink" href="/login.html">Log In</a>
      </p>
    </form>
  </main>

  <script>
    (() => {
      const form = document.getElementById('registerForm');
      const submitButton = document.getElementById('registerSubmit');
      const message = document.getElementById('formMessage');

      const params = new URLSearchParams(window.location.search);

      // Only allow internal paths. Never redirect to an external website.
      function getSafeReturnUrl(value) {
        if (!value) return '/homepage.html';

        try {
          const url = new URL(value, window.location.origin);

          if (url.origin !== window.location.origin) {
            return '/homepage.html';
          }

          if (!url.pathname.startsWith('/') || url.pathname.startsWith('//')) {
            return '/homepage.html';
          }

          if (/^\/(login|register)\.html$/i.test(url.pathname)) {
            return '/homepage.html';
          }

          return url.pathname + url.search + url.hash;
        } catch {
          return '/homepage.html';
        }
      }

      const returnTo = getSafeReturnUrl(params.get('returnTo'));

      // Keep the same destination when moving between login and registration.
      document.getElementById('loginLink').href =
        '/login.html?returnTo=' + encodeURIComponent(returnTo);

      document.getElementById('googleSignup').addEventListener('click', () => {
        window.location.href =
          '/auth/google?returnTo=' + encodeURIComponent(returnTo);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';

        const name = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!name || !email || !password || !confirmPassword) {
          message.textContent = 'Please complete all fields.';
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          message.textContent = 'Please enter a valid email address.';
          return;
        }

        if (password.length < 8) {
          message.textContent = 'Your password must contain at least 8 characters.';
          return;
        }

        if (password !== confirmPassword) {
          message.textContent = 'Your passwords do not match.';
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Creating account...';

        try {
          const response = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              name,
              email,
              password,
              confirmPassword
            })
          });

          const data = await response.json();

          if (!response.ok || !data.loggedIn) {
            throw new Error(data.error || 'Unable to create your account.');
          }

          window.location.replace(returnTo);

        } catch (error) {
          message.textContent =
            error.message || 'Something went wrong. Please try again.';

          submitButton.disabled = false;
          submitButton.textContent = 'Create Account';
        }
      });
    })();
  </script>
</body>
</html>
