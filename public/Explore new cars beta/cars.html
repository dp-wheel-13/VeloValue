<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VeloValue – Car Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    
    /* ===========================================================
   GLOBAL + ROOT VARIABLES
=========================================================== */
:root {
  --bg: #000; /* matte premium background */
  --text: #fff;
  --accent: #1db954; /* green price bar */
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --shadow-1: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-2: 0 18px 50px rgba(0, 0, 0, 0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
html, body { height:100%; }

body {
  font-family:'Inter',sans-serif;
  line-height:1.35;
  background:var(--bg);
  color:var(--text);
  padding-top: var(--header-offset);
}

a { color:var(--text); }

/* ===========================================================
   ORIGINAL BASE HEADER (before responsive overrides)
=========================================================== */
header {
  position:sticky;
  top:0; left:0; width:100%;
  padding:1rem 2rem;
  background:var(--bg);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.1);
}

header h1 { font-size:24px; font-weight:800; }

header nav {
  display:flex; align-items:center;
  gap:16px; flex-wrap:wrap;
}
header nav a {
  text-decoration:none;
  font-size:16px;
  font-weight:600;
}
header nav a:hover { text-decoration:underline; }

.language-select select {
  background:var(--bg); color:var(--text);
  border:1px solid rgba(255,255,255,.5);
  border-radius:6px;
  padding:4px 8px;
  font-size:14px; cursor:pointer;
}

/* Auth button */
#authSection button {
  background:var(--text); color:var(--bg);
  border:1px solid var(--text);
  border-radius:20px;
  padding:6px 12px;
  font-weight:600;
  cursor:pointer;
  transition:all .25s;
}
#authSection button:hover {
  background:transparent;
  color:var(--text);
  border-color:var(--accent);
}

/* ===========================================================
   WISHLIST / ICON BUTTONS
=========================================================== */
.wishlist { position:relative; }

.icon-btn {
  position:relative;
  background:transparent;
  color:var(--text);
  border:1px solid rgba(255,255,255,.25);
  width:40px; height:40px;
  border-radius:50%;
  display:grid; place-items:center;
  cursor:pointer;
  transition:border-color .2s;
}
.icon-btn:hover { border-color:var(--accent); }

.icon-btn svg {
  width:18px; height:18px;
  stroke:currentColor;
  fill:transparent;
  stroke-width:1.8;
}

.icon-btn .badge {
  position:absolute;
  top:-6px; right:-6px;
  min-width:18px; height:18px;
  padding:0 5px;
  display:none;
  align-items:center; justify-content:center;
  background:var(--accent); color:#000;
  border-radius:999px;
  font-size:11px; font-weight:800;
}

.wishlist .dropdown {
  position:absolute; right:0; top:calc(100% + 10px);
  width:320px; max-height:420px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  box-shadow:var(--shadow-2);
  display:none;
  overflow:hidden;
}
.wishlist.open .dropdown { display:block; }

.dropdown-head {
  background:#111;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding:10px 12px;
  display:flex; justify-content:space-between;
  align-items:center;
}

.dropdown-list {
  padding:10px;
  display:grid;
  gap:10px;
  max-height:360px;
  overflow:auto;
}

.wish-item {
  display:grid; grid-template-columns:44px 1fr auto;
  gap:10px; align-items:center;
  padding:8px;
  border-radius:10px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer;
  transition:background .2s ease, transform .15s ease;
}
.wish-item:hover {
  background:#222;
  transform:translateY(-2px);
}
.wish-item img {
  width:44px; height:44px;
  object-fit:cover;
  border-radius:8px;
}

.remove-btn {
  background:transparent; color:var(--text);
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  font-size:12px;
  padding:6px 8px;
  cursor:pointer;
}

/* ===========================================================
   LAYOUT
=========================================================== */
.container {
  width:min(1200px,94vw);
  margin:0 auto;
  padding:24px 0 40px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  align-items:start;
}

@media (max-width:980px) {
  .container {
    grid-template-columns:1fr;
    padding:18px 0 28px;
  }
}

/* ===========================================================
   PANELS
=========================================================== */
.panel {
  border-radius: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 28px 32px;
  transition: all 0.4s ease;
  box-shadow: none;
}
.panel:hover {
  transform: translateY(-6px);
  box-shadow: 0 25px 70px rgba(0,0,0,0.7);
}

/* ===========================================================
   LEFT SECTION (logo + brand + image)
=========================================================== */
.left { position:relative; align-self:start; }

.left .car-header {
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:14px;
}

.car-logo {
  width:90px; height:90px;
  display:block !important;
  opacity:1 !important;
  border-radius:12px;
  object-fit:contain;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  padding:8px;
}

.title-stack { display:flex; flex-direction:column; gap:4px; }

.brand { font-size:28px; font-weight:900; color:var(--accent); }
.model { font-size:22px; font-weight:700; opacity:.95; }

.pill {
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 12px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:transparent;
  font-weight:700;
  width:max-content;
}

.hero-wrap {
  position:relative;
  width:100%;
  max-width:720px;
  margin:10px auto 0;
  height:420px;
}

.hero {
  width:100%; height:100%;
  border-radius:16px;
  display:block;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.02);
  box-shadow:var(--shadow-1);
  object-fit:contain;
}

/* heart + compare buttons */
.img-heart, .img-compare {
  position:absolute;
  width:40px; height:40px;
  border-radius:999px;
  display:grid; place-items:center;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.25);
  color:var(--text);
  cursor:pointer;
  transition:transform .12s, border-color .2s, color .2s, background .2s;
}
.img-heart { top:10px; right:10px; }
.img-compare { top:10px; left:10px; backdrop-filter:blur(4px); }

.img-heart:hover, .img-compare:hover { border-color:var(--accent); }

.img-heart svg, .img-compare svg {
  width:20px; height:20px;
  stroke:currentColor;
  fill:transparent;
  stroke-width:1.8;
}

/* ===========================================================
   PRICE BOX
=========================================================== */
.price-box {
  background:linear-gradient(135deg, #1db954, #1ed760);
  color:#000;
  font-weight:900;
  border-radius:16px;
  padding:14px 20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.6);
  transition:transform .2s ease;
}
.price-box:hover {
  transform:scale(1.03);
}

/* ===========================================================
   SPECS GRID
=========================================================== */
.spec-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px 16px;
  margin:6px 0 14px;
}

.spec-grid .row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.02);
}

/* ===========================================================
   ✅ UPDATED ACCORDION (OPTION A: applies to ALL)
=========================================================== */
.accordion {
  margin-bottom: 20px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.03);
  transition: all 0.4s ease;
}

.acc-header {
  display: flex;
  justify-content: space-between; /* spreads text and arrow to edges */
  align-items: center;
  padding: 16px 24px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.04);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff;
  line-height: 1.2;
}

.acc-header .title {
  flex: 1; /* text takes available space */
}

/* ✅ YELLOW HOVER MATCHING YOUR FIRST CODE */
.acc-header:hover {
  background: rgba(242, 201, 76, 0.08); /* yellow hover like first code */
}

/* ✅ CORRECT SE → E ARROW */
.acc-header .arrow {
  width: 8px;
  height: 8px;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(45deg);
  transition: transform 0.3s ease;
  margin-left: 16px; /* optional spacing */
}

.accordion.open .acc-header .arrow {
  transform: rotate(135deg); /* rotated when open */
}

/* ✅ Smooth slide */
.acc-content {
  max-height: 0;
  overflow: hidden;
  padding: 0 24px;
  font-size: 16px;
  color: #ddd;
  transition: max-height 0.5s ease, padding 0.3s ease;
}

/* ✅ Expanded state */
.accordion.open .acc-content {
  max-height: 600px;
  padding: 14px 24px;
}

/* ===========================================================
   KV ITEMS INSIDE ACCORDION
=========================================================== */
.kv {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
}

.kv .item {
  background:#1a1a1a;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:12px 16px;
  transition:background .2s ease, transform .15s ease;
}
.kv .item:hover {
  background:#222;
  transform:translateY(-2px);
}

.kv .k { opacity:.8; }
.kv .v { font-weight:700; }

@media (max-width:700px) {
  .kv { grid-template-columns:1fr; }
}

/* ===========================================================
   TOASTS
=========================================================== */
.toast-wrap {
  position:fixed;
  right:16px; bottom:16px;
  display:grid; gap:10px;
  z-index:2000;
}
.toast {
  background:var(--accent);
  color:#000;
  font-weight:800;
  border-radius:12px;
  padding:10px 12px;
  box-shadow:var(--shadow-2);
  transform:translateY(10px);
  opacity:0;
  animation:toast-in .2s ease forwards;
}

@keyframes toast-in {
  to { transform:translateY(0); opacity:1; }
}

/* ===========================================================
   RESPONSIVE HEADER OVERRIDES (your second block)
=========================================================== */
header, header * {
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

header {
  position:fixed;
  top:0; left:0; right:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 2rem;
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid #333;
  z-index:2000;
  backdrop-filter:blur(6px);
}

.header-left { display:flex; align-items:center; gap:15px; }
.header-right { display:flex; align-items:center; gap:15px; }

header h1 a {
  font-size:1.8rem;
  font-weight:800;
  color:#fff;
  text-decoration:none;
}

/* Desktop nav */
nav.desktop-nav {
  display:flex; gap:20px;
}
nav.desktop-nav a {
  color:#fff;
  font-weight:600;
  font-size:16px;
  text-decoration:none;
  white-space:nowrap;
}
nav.desktop-nav a:hover { text-decoration:underline; }

/* Language */
.language-select { position:relative; }
.language-select select {
  appearance:none;
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:6px;
  padding:6px 30px 6px 10px;
  font-size:.9rem;
  cursor:pointer;
}

/* Auth button */
#authSection .text-btn {
  display:inline-flex;
  background:#fff;
  color:#000;
  border:none;
  border-radius:999px;
  padding:8px 16px;
  font-weight:600;
  cursor:pointer;
  align-items:center;
  justify-content:center;
}
#authSection .icon-btn { display:none; }

/* Hamburger */
.hamburger {
  font-size:1.8rem;
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2200;
  width:40px;
  height:40px;
}

/* MOBILE MENU PANEL */
.menu {
  position:fixed;
  top:0; left:-300px;
  width:300px; height:100vh;
  background:rgba(17,17,17,0.95);
  border-right:1px solid rgba(255,255,255,0.12);
  padding:3rem 2rem;
  display:flex; flex-direction:column;
  gap:2rem;
  transition:left .3s ease;
  z-index:2100;
  backdrop-filter:blur(10px);
  border-radius:0 1rem 1rem 0;
}
.menu.active { left:0; }

.menu a {
  color:#fff;
  font-size:1.6rem;
  font-weight:800;
  text-decoration:none;
}

/* Overlay */
.menu-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.5);
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
  z-index:2050;
}
.menu-overlay.active {
  opacity:1; pointer-events:auto;
}

/* TAB VIEW */
@media(max-width:1024px){
  nav.desktop-nav { display:none; }
  .hamburger { display:flex; }

  .hamburger { position:relative; font-size:0; }
  .hamburger::before, .hamburger::after {
    content:"";
    position:absolute;
    left:50%;
    width:22px; height:2px;
    background:currentColor;
    transform:translateX(-50%);
    transition:transform .25s ease, top .25s ease;
  }
  .hamburger::before { top:calc(50% - 6px); }
  .hamburger::after  { top:calc(50% + 6px); }

  .hamburger {
    background-image:linear-gradient(currentColor,currentColor);
    background-repeat:no-repeat;
    background-position:center;
    background-size:22px 2px;
  }
  .hamburger.is-active { background-size:0 0; }
  .hamburger.is-active::before {
    top:50%; transform:translateX(-50%) rotate(45deg);
  }
  .hamburger.is-active::after {
    top:50%; transform:translateX(-50%) rotate(-45deg);
  }
}

/* MOBILE  */
@media(max-width:768px){
  #authSection .text-btn { display:none; }

  #authSection .icon-btn {
    display:inline-flex;
    width:40px; height:40px;
    border-radius:50%;
    background:#fff; color:#000;
    border:none;
    font-size:1.2rem;
    align-items:center; justify-content:center;
  }

  .language-select {
    width:40px; height:40px;
    border-radius:50%;
    background:#111;
    border:1px solid #fff;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .language-select::before {
    content:"🌐";
    color:#fff;
    font-size:1.2rem;
    position:absolute;
  }
  .language-select select {
    opacity:0;
    position:absolute;
    inset:0;
    cursor:pointer;
  }
}

/* MOBILE SHRINK FIX */
@media(max-width:768px){
  header {
    padding:.5rem .8rem !important;
    height:60px;
  }
  .header-left,
  .header-right { gap:10px !important; }

  .hamburger { width:30px !important; height:30px !important; }
  .hamburger::before,
  .hamburger::after { width:16px !important; }
  .hamburger { background-size:16px 2px !important; }

  header h1 a { font-size:1.3rem !important; }

  #authSection .icon-btn {
    width:30px !important; height:30px !important; font-size:1rem !important;
  }

  .language-select {
    width:30px !important; height:30px !important;
  }
  .language-select::before { font-size:1rem !important; }

  .wishlist .icon-btn {
    width:30px !important; height:30px !important;
  }
  .wishlist .icon-btn svg {
    width:14px !important; height:14px !important;
  }
  .wishlist .badge {
    top:-4px !important; right:-4px !important;
    min-width:14px !important; height:14px !important;
    font-size:9px !important;
  }
}
</style>
</head>
<body>

  <!-- Unified Header -->
  <header>
    <div class="header-left">
      <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <h1><a href="/homepage.html">VeloValue</a></h1>
    </div>
    <div class="header-right">
      <nav class="desktop-nav">
        <a href="/homepage.html">HOME</a>
        <a href="/Explore smart garage beta/smartgarage.html">EXPLORE SMART GARAGE</a>
        <a href="/Velocharge beta/velocharge.html">VELOCHARGE</a>
        <a href="#about">ABOUT US</a>
      </nav>

      <div class="language-select">
        <select id="languageSelect">
          <option value="en">🇬🇧 English</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
      </div>

      <!-- Wishlist dropdown -->
      <div class="wishlist" id="wishlist">
        <button id="wishlistBtn" class="icon-btn" aria-label="Wishlist" aria-expanded="false" aria-controls="wishlistMenu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.1 8.64l-.1.1-.1-.1c-1.68-1.79-4.53-1.79-6.21 0-1.8 1.92-1.8 5.02 0 6.94L12 22l6.31-6.42c1.8-1.92 1.8-5.02 0-6.94-1.68-1.79-4.53-1.79-6.21 0z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="badge" id="wishlistBadge">0</span>
        </button>
        <div id="wishlistMenu" class="dropdown" role="menu" aria-label="Wishlist">
          <div class="dropdown-head">
            <strong>Wishlist</strong>
            <button id="clearWishlist" class="text-btn">Clear all</button>
          </div>
          <div id="wishlistItems" class="dropdown-list">
            <div class="dropdown-empty" style="padding:20px; text-align:center; opacity:.75;">Your wishlist is empty.</div>
          </div>
        </div>
      </div>

      <!-- Compare dropdown -->
      <div class="wishlist compare" id="compare">
        <button id="compareBtn" class="icon-btn" aria-label="Compare" aria-expanded="false" aria-controls="compareMenu" title="Compare">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17h6M3 7h10M3 12h14" stroke="currentColor" stroke-width="1.6" fill="none"/>
          </svg>
          <span class="badge" id="compareBadge">0</span>
        </button>
        <div id="compareMenu" class="dropdown" role="menu" aria-label="Compare">
          <div class="dropdown-head">
            <strong>Compare</strong>
            <button id="clearCompare" class="text-btn">Clear all</button>
          </div>
          <div id="compareItems" class="dropdown-list">
            <div class="dropdown-empty" style="padding:20px; text-align:center; opacity:.75;">Nothing to compare.</div>
          </div>
          <div style="padding:10px; border-top:1px solid rgba(255,255,255,.1); display:flex; justify-content:flex-end;">
            <button id="viewCompare" class="text-btn">View compare</button>
          </div>
        </div>
      </div>

      <div id="authSection">
        <button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>
      </div>
    </div>
  </header>

  <!-- Slide-in mobile menu + overlay -->
  <nav class="menu" id="hamburgerMenu" aria-hidden="true">
    <a href="/homepage.html">HOME</a>
    <a href="/Explore smart garage beta/smartgarage.html">EXPLORE SMART GARAGE</a>
    <a href="/Velocharge beta/velocharge.html">DISCOVER VELOCHARGE</a>
    <a href="#about">ABOUT US</a>
  </nav>
  <div class="menu-overlay"></div>

  <!-- Content -->
  <main class="container">
    <!-- LEFT: image + brand/model/fuel/price -->
    <section class="panel left">
      <!-- Share button -->
      <button id="shareBtn" class="share-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 5l5 5-5 5M19 10H9a5 5 0 100 10" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="car-header">
        <img class="car-logo" id="carLogo" alt="Brand logo" onerror="this.style.display='none'"/>
        <div class="title-stack">
          <div class="brand" id="brand">—</div>
          <div class="model" id="model">—</div>
          <div class="pill" id="fuelPill">Fuel: —</div>
          <div class="price" id="priceFrom">Price from: —</div>
        </div>
      </div>

      <div class="hero-wrap">
        <img id="heroImg" class="hero" alt="Car image" src="" />
        <!-- Compare (left) -->
        <button id="imgCompare" class="img-compare" aria-label="Add to compare" aria-pressed="false" title="Compare">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17h6M3 7h10M3 12h14" stroke="currentColor" stroke-width="1.8" fill="none"/>
          </svg>
        </button>
        <!-- Wishlist (right) -->
        <button id="imgHeart" class="img-heart" aria-label="Add to wishlist" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.1 8.64l-.1.1-.1-.1c-1.68-1.79-4.53-1.79-6.21 0-1.8 1.92-1.8 5.02 0 6.94L12 22l6.31-6.42c1.8-1.92 1.8-5.02 0-6.94-1.68-1.79-4.53-1.79-6.21 0z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>

  <!-- Header JS: hamburger/menu/auth + header offset -->
  <script>
    (function(){
      const hamburger = document.querySelector(".hamburger");
      const menu = document.getElementById("hamburgerMenu");
      const overlay = document.querySelector(".menu-overlay");

      function openMenu(){
        hamburger.setAttribute("aria-expanded","true");
        hamburger.classList.add("is-active");
        if (window.innerWidth > 1024) hamburger.textContent = "✕";
        menu.classList.add("active");
        overlay.classList.add("active");
        menu.setAttribute("aria-hidden","false");
      }
      function closeMenu(){
        hamburger.setAttribute("aria-expanded","false");
        hamburger.classList.remove("is-active");
        if (window.innerWidth > 1024) hamburger.textContent = "☰";
        menu.classList.remove("active");
        overlay.classList.remove("active");
        menu.setAttribute("aria-hidden","true");
      }
      function toggleMenu(){
        if (menu.classList.contains("active")) closeMenu();
        else openMenu();
      }
      hamburger.addEventListener("click", toggleMenu);
      overlay.addEventListener("click", closeMenu);
      window.addEventListener("resize", () => {
        if(window.innerWidth > 1024 && menu.classList.contains("active")) closeMenu();
      });

      // Auth button toggle
      const authSection = document.getElementById("authSection");
      function updateAuthButton() {
        if(window.innerWidth <= 768) {
          authSection.innerHTML = `<button class="icon-btn" onclick="window.location.href='login.html'">👤</button>`;
        } else {
          authSection.innerHTML = `<button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>`;
        }
      }
      updateAuthButton();
      window.addEventListener("resize", updateAuthButton);

      // Sync body padding with actual header height
      function syncHeaderOffset(){
        const header = document.querySelector('header');
        if (!header) return;
        const h = header.offsetHeight;
        document.documentElement.style.setProperty('--header-offset', h + 'px');
      }
      window.addEventListener('load', syncHeaderOffset);
      window.addEventListener('resize', syncHeaderOffset);
    })();
  </script>

  <script>
    // ---------- Inline fallback data (only used if sessionStorage is empty) ----------
    const cars = [
      { id:'lamborghini-revuelto-2024', brand:'Lamborghini', model:'Revuelto', year:2024, body:'Coupé', doors:2, seats:2, fuel:'PHEV', transmission:'Automatic', drivetrain:'AWD', powerKw:747, powerPs:1015, torqueNm:725, zeroTo100KmhS:2.5, topSpeedKmh:350, energyConsumptionKwhPer100km:null, fuelConsumptionLPer100km:null, co2GPerKm:null, euroStandard:null, lengthMm:4947, widthMm:2033, heightMm:1160, wheelbaseMm:2779, bootVolumeSeatsUpL:132, kerbWeightKg:1772, rangeWltpKm:null, batteryCapacityNetKwh:3.8, chargeAcMaxKw:7, chargeDcMaxKw:null, chargeDc10To80Min:null, connector:'Type 2', ncapStars:null, ncapYear:null, warrantyYears:3, warrantyKm:100000, priceFromEur:500000, image:'https://images.unsplash.com/photo-1606663301623-c7e98de94e02?q=80&w=1400&auto=format&fit=crop', logo:'https://upload.wikimedia.org/wikipedia/commons/0/0c/Lamborghini_Logo.svg' },
      { id:'tesla-model-3-2024', brand:'Tesla', model:'Model 3', year:2024, body:'Sedan', doors:4, seats:5, fuel:'BEV', transmission:'Single-speed', drivetrain:'RWD', powerKw:208, powerPs:283, torqueNm:340, zeroTo100KmhS:6.1, topSpeedKmh:201, energyConsumptionKwhPer100km:14.5, fuelConsumptionLPer100km:null, co2GPerKm:0, euroStandard:null, lengthMm:4720, widthMm:1849, heightMm:1441, wheelbaseMm:2875, bootVolumeSeatsUpL:594, kerbWeightKg:1760, rangeWltpKm:513, batteryCapacityNetKwh:57, chargeAcMaxKw:11, chargeDcMaxKw:170, chargeDc10To80Min:27, connector:'Type 2 / CCS2', ncapStars:5, ncapYear:2019, warrantyYears:4, warrantyKm:80000, priceFromEur:38990, image:'https://images.unsplash.com/photo-1553440569-bcc63803a83d?q=80&w=1400&auto=format&fit=crop', logo:'https://upload.wikimedia.org/wikipedia/commons/b/bd/Tesla_Motors.svg' },
      { id:'fiat-500-2024', brand:'Fiat', model:'500', year:2024, body:'Hatchback', doors:3, seats:4, fuel:'BEV', transmission:'Single-speed', drivetrain:'FWD', powerKw:87, powerPs:118, torqueNm:220, zeroTo100KmhS:9.0, topSpeedKmh:150, energyConsumptionKwhPer100km:14.8, fuelConsumptionLPer100km:null, co2GPerKm:0, euroStandard:null, lengthMm:3632, widthMm:1683, heightMm:1527, wheelbaseMm:2322, bootVolumeSeatsUpL:185, kerbWeightKg:1290, rangeWltpKm:320, batteryCapacityNetKwh:37.3, chargeAcMaxKw:11, chargeDcMaxKw:85, chargeDc10To80Min:30, connector:'Type 2 / CCS2', ncapStars:4, ncapYear:2021, warrantyYears:3, warrantyKm:100000, priceFromEur:16500, image:'https://images.unsplash.com/photo-1615089000191-3b82ba9fb3a5?q=80&w=1400&auto=format&fit=crop', logo:'https://upload.wikimedia.org/wikipedia/commons/9/9d/Logo_FIAT_2020.svg' }
    ];
    const carsById = new Map(cars.map(c=>[c.id,c]));
    const resolveByIdLike = id => carsById.get(id) || [...carsById.values()].find(x => x.id.startsWith(id));

    // ---------- Helpers ----------
    const $ = (s, r=document) => r.querySelector(s);
    const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
    const nd = v => (v===null || v===undefined || v==='') ? '—' : v;
    const toEUR = n => n==null ? '—' : `€${Number(n).toLocaleString()}`;
    const mm = n => n==null ? '—' : `${n} mm`;
    const ltr = n => n==null ? '—' : `${n} L`;
    const kwps = (kw, ps) => (kw||ps) ? `${kw?kw+' kW':''}${kw&&ps?' / ':''}${ps?ps+' PS':''}` : '—';
    const kmh = n => n==null ? '—' : `${n} km/h`;
    const sec = n => n==null ? '—' : `${n} s`;
    const showToast = msg => { const wrap = $('#toastWrap'); const el = document.createElement('div'); el.className='toast'; el.textContent=msg; wrap.appendChild(el); setTimeout(()=>{ el.style.transition='opacity .2s, transform .2s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; },1600); setTimeout(()=> wrap.contains(el) && wrap.removeChild(el), 1850); };

    // ---------- Wishlist ----------
    const WISHLIST_KEY = 'velovalue_wishlist_v1';
    function getWishlist(){ try { return new Set(JSON.parse(localStorage.getItem(WISHLIST_KEY)||'[]')); } catch { return new Set(); } }
    function saveWishlist(set){ localStorage.setItem(WISHLIST_KEY, JSON.stringify([...set])); }
    function updateWishlistBadge(){ const set = getWishlist(); const n = set.size; const b = $('#wishlistBadge'); b.style.display = n ? 'grid' : 'none'; if(n) b.textContent = n; }
    function buildWishlistMenu(){
      const set = getWishlist(); const list = $('#wishlistItems');
      if(!set.size){ list.innerHTML = '<div class="dropdown-empty" style="padding:20px; text-align:center; opacity:.75;">Your wishlist is empty.</div>'; return; }
      list.innerHTML = [...set].map(id=>{
        const c = resolveByIdLike(id);
        if(!c) return `<div class="wish-item" data-id="${id}">
          <div class="wish-meta"><div class="wish-title">${id}</div><div class="wish-sub">—</div></div>
          <button class="remove-btn" data-remove="${id}">Remove</button>
        </div>`;
        return `<div class="wish-item" data-id="${id}">
          <img src="${c.image}" alt="${c.brand} ${c.model}">
          <div class="wish-meta">
            <div class="wish-title">${c.brand} ${c.model}</div>
            <div class="wish-sub">${c.body} • ${toEUR(c.priceFromEur)}</div>
          </div>
          <button class="remove-btn" data-remove="${id}">Remove</button>
        </div>`;
      }).join('');
    }
    function setHeartActive(active){
      const btn = $('#imgHeart');
      if (!btn) return;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.setAttribute('aria-label', active ? 'Remove from wishlist' : 'Add to wishlist');
    }
    function toggleWishlist(id, title=''){
      const set = getWishlist();
      const had = set.has(id);
      if(had){ set.delete(id); showToast(`Removed: ${title || id}`); }
      else { set.add(id); showToast(`Added: ${title || id}`); }
      saveWishlist(set); updateWishlistBadge(); buildWishlistMenu(); setHeartActive(set.has(id));
      const btn = $('#imgHeart'); if(btn){ btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
    }

    // ---------- Compare (same keys as Explore) ----------
    const CMP_KEY = 'vv_compare_ids';
    const META_KEY = 'vv_compare_meta';

    (function ensureUserKey(){ window.__vvUserKey = window.__vvUserKey || 'guest'; })();
    function scopeKey(base) {
      const k = (window.__vvUserKey || 'guest').toLowerCase();
      return `${base}::${k}`;
    }
    function migrateLegacyOnce(base) {
      const scoped = scopeKey(base);
      const migratedFlag = `${scoped}::migrated`;
      if (localStorage.getItem(migratedFlag)) return;
      const legacy = localStorage.getItem(base);
      if (legacy && !localStorage.getItem(scoped)) localStorage.setItem(scoped, legacy);
      localStorage.setItem(migratedFlag, '1');
    }
    document.addEventListener('vv:user-change', () => {
      ['velovalue_wishlist_v1', 'vv_compare_ids', 'vv_compare_meta'].forEach(migrateLegacyOnce);
      if (typeof updateWishlistBadge === 'function') updateWishlistBadge();
      if (typeof buildWishlistMenu === 'function') buildWishlistMenu();
      if (typeof updateCompareBadge === 'function') updateCompareBadge();
      if (typeof buildCompareMenu === 'function') buildCompareMenu();
    });

    function loadCompare(){ try { return new Set(JSON.parse(localStorage.getItem(CMP_KEY) || '[]')); } catch { return new Set(); } }
    function saveCompare(set){ localStorage.setItem(CMP_KEY, JSON.stringify([...set])); }
    function loadMeta(){ try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch { return {}; } }
    function saveMeta(obj){ localStorage.setItem(META_KEY, JSON.stringify(obj)); }
    function setCompareActive(active){
      const btn = $('#imgCompare');
      if (!btn) return;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.setAttribute('aria-label', active ? 'Remove from compare' : 'Add to compare');
    }
    function toggleCompare(id, meta){
      const set = loadCompare();
      const m = loadMeta();
      if (set.has(id)) {
        set.delete(id); delete m[id];
        saveCompare(set); saveMeta(m);
        setCompareActive(false);
        showToast('Removed from compare');
      } else {
        if (set.size >= 4) { showToast('You can compare up to 4 cars'); return; }
        set.add(id); m[id] = m[id] || meta;
        saveCompare(set); saveMeta(m);
        setCompareActive(true);
        showToast('Added to compare');
      }
      if (typeof updateCompareBadge === 'function') updateCompareBadge();
      if (typeof buildCompareMenu === 'function') buildCompareMenu();
    }
    function buildCompareUrl(){
      const ids = [...loadCompare()];
      const url = new URL('compare.html', location.href);
      if (ids.length) url.searchParams.set('ids', ids.join(','));
      return url.toString();
    }
    function updateCompareBadge(){
      const n = loadCompare().size;
      const b = document.getElementById('compareBadge');
      if (!b) return;
      if (n > 0) { b.style.display = 'grid'; b.textContent = n; }
      else { b.style.display = 'none'; }
    }
    function buildCompareMenu(){
      const listEl = document.getElementById('compareItems');
      if (!listEl) return;
      const ids = [...loadCompare()];
      const meta = loadMeta();
      if (!ids.length) {
        listEl.innerHTML = `<div class="dropdown-empty" style="padding:20px; text-align:center; opacity:.75;">Nothing to compare.</div>`;
        return;
      }
      listEl.innerHTML = ids.map(id => {
        const m = meta[id] || {};
        const name = [m.brand, m.model].filter(Boolean).join(' ') || id;
        const sub = [m.body, (m.price!=null ? '€'+Number(m.price).toLocaleString() : '')].filter(Boolean).join(' • ');
        const img = m.img || '';
        return `
          <div class="wish-item" data-id="${id}">
            ${img ? `<img src="${img}" alt="${name}">` : `<div style="width:44px;height:44px;border-radius:8px;background:#111;display:grid;place-items:center;opacity:.6">—</div>`}
            <div class="wish-meta">
              <div class="wish-title">${name}</div>
              <div class="wish-sub">${sub || ''}</div>
            </div>
            <button class="remove-btn" data-remove="${id}">Remove</button>
          </div>`;
      }).join('');
    }
    (function wireHeaderCompare(){
      const wrap = document.getElementById('compare');
      const btn  = document.getElementById('compareBtn');
      const items = document.getElementById('compareItems');
      const clearBtn = document.getElementById('clearCompare');
      const viewBtn = document.getElementById('viewCompare');
      if (!wrap || !btn) return;
      btn.addEventListener('click', ()=>{
        const open = wrap.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', (e)=>{
        if (!wrap.contains(e.target)) {
          wrap.classList.remove('open');
          btn.setAttribute('aria-expanded','false');
        }
      });
      document.addEventListener('keydown', (e)=>{
        if (e.key === 'Escape') {
          wrap.classList.remove('open');
          btn.setAttribute('aria-expanded','false');
        }
      });
      if (items) {
        items.addEventListener('click', (e)=>{
          const rm = e.target.closest('[data-remove]'); if(!rm) return;
          const id = rm.getAttribute('data-remove');
          const m = loadMeta();
          const set = loadCompare(); set.delete(id); delete m[id];
          saveCompare(set); saveMeta(m);
          updateCompareBadge(); buildCompareMenu();
        });
      }
      if (clearBtn) clearBtn.addEventListener('click', ()=>{
        saveCompare(new Set()); saveMeta({});
        updateCompareBadge(); buildCompareMenu();
      });
      if (viewBtn) viewBtn.addEventListener('click', ()=>{
        const n = loadCompare().size;
        if (n < 2) { alert('Add minimum of 2 cars to compare'); return; }
        location.href = buildCompareUrl();
      });
    })();

    // ---------- Share ----------
    async function shareCurrent(url, title){
      try {
        if (navigator.share) {
          await navigator.share({ title, url });
        } else {
          await navigator.clipboard.writeText(url);
          showToast('Link copied');
        }
      } catch {}
    }

    // ---------- Accordions (accessible) ----------
    function toggleAccordion(btn){
      const panel = document.getElementById(btn.getAttribute('aria-controls'));
      const expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      panel.hidden = expanded;
      btn.closest('.accordion').classList.toggle('open', !expanded);
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      $$('.acc-header').forEach(btn=>{
        btn.addEventListener('click', ()=> toggleAccordion(btn));
        btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleAccordion(btn); }});
      });
    });

    // ---------- Page init ----------
    (function init(){
      const WIRE_KEY = 'vv_selected_car';
      let car = null;
      let idParam = new URLSearchParams(location.search).get('id');

      try {
        const raw = sessionStorage.getItem(WIRE_KEY);
        if (raw) {
          const passed = JSON.parse(raw);
          car = { ...passed };
          if (!idParam && passed.id) idParam = passed.id;
        }
      } catch {}

      if (!car) {
        if (!idParam) idParam = 'lamborghini-revuelto-2024';
        if (!new URLSearchParams(location.search).get('id')) {
          history.replaceState(null,'',`${location.pathname}?id=${encodeURIComponent(idParam)}`);
        }
        car = resolveByIdLike(idParam) || null;
      }

      if (!car) {
        document.body.innerHTML = '<div style="padding:40px; color:#fff">Car not found. <a href="/homepage.html" style="color:#1db954">Back to Explore</a></div>';
        return;
      }

      // ----- Fill header/left panel -----
      document.title = `VeloValue – ${[car.brand, car.model, car.year].filter(Boolean).join(' ')}`;
      $('#brand').textContent = car.brand || '—';
      $('#model').textContent = [car.model, car.year].filter(Boolean).join(' ') || '—';
      $('#fuelPill').textContent = `Fuel: ${nd(car.fuel)}`;
      $('#priceFrom').textContent = `Price from: ${toEUR(car.priceFromEur)}`;

      if (car.image) $('#heroImg').src = car.image;
      $('#priceBadge').textContent = `Price from: ${toEUR(car.priceFromEur)}`;

      // ----- Summary grid (right) -----
      const summary = [
        ['Body', nd(car.body)],
        ['Drivetrain', nd(car.drivetrain)],
        ['Transmission', nd(car.transmission)],
        ['Power', kwps(car.powerKw, car.powerPs)],
        ['Torque', car.torqueNm ? `${car.torqueNm} Nm` : '—'],
        ['0–100 km/h', sec(car.zeroTo100KmhS)],
        ['Top speed', kmh(car.topSpeedKmh)],
        ['Seats / Doors', `${nd(car.seats)} / ${nd(car.doors)}`]
      ];
      $('#summaryGrid').innerHTML = summary.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');

      // ----- Accordions -----
      const tech = [
        ['Fuel', nd(car.fuel)],
        ['Transmission', nd(car.transmission)],
        ['Drivetrain', nd(car.drivetrain)],
        ['Power', kwps(car.powerKw, car.powerPs)],
        ['Torque', car.torqueNm ? `${car.torqueNm} Nm` : '—']

      $('#panel-tech').innerHTML = `<div class="kv">${tech.map(([k,v])=>`<div class="item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

      const perf = [
        ['0–100 km/h', sec(car.zeroTo100KmhS)],
        ['Top speed', kmh(car.topSpeedKmh)],
        ['Fuel cons. WLTP', car.fuelConsumptionLPer100km ? `${car.fuelConsumptionLPer100km} L/100 km` : '—'],
        ['Energy cons. WLTP', car.energyConsumptionKwhPer100km ? `${car.energyConsumptionKwhPer100km} kWh/100 km` : '—'],

        ['Euro standard', nd(car.euroStandard)]

      $('#panel-perf').innerHTML = `<div class="kv">${perf.map(([k,v])=>`<div class="item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

      const dim = [
        ['Length', mm(car.lengthMm)],
        ['Width', mm(car.widthMm)],
        ['Height', mm(car.heightMm)],
        ['Wheelbase', mm(car.wheelbaseMm)],
        ['Boot volume', ltr(car.bootVolumeSeatsUpL)],
        ['Kerb weight', car.kerbWeightKg ? `${car.kerbWeightKg} kg` : '—']
      ];
      $('#panel-dim').innerHTML = `<div class="kv">${dim.map(([k,v])=>`<div class="item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

      const chg = [
        ['WLTP range', car.rangeWltpKm ? `${car.rangeWltpKm} km` : '—'],
        ['Battery (net)', car.batteryCapacityNetKwh ? `${car.batteryCapacityNetKwh} kWh` : '—'],
        ['AC max', car.chargeAcMaxKw ? `${car.chargeAcMaxKw} kW` : '—'],
        ['DC max', car.chargeDcMaxKw ? `${car.chargeDcMaxKw} kW` : '—'],
        ['DC 10–80%', car.chargeDc10To80Min ? `${car.chargeDc10To80Min} min` : '—'],
        ['Connector', nd(car.connector)]

      $('#panel-charge').innerHTML = `<div class="kv">${chg.map(([k,v])=>`<div class="item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

      const war = [
        ['Warranty', (car.warrantyYears||car.warrantyKm) ? `${nd(car.warrantyYears)} yrs / ${car.warrantyKm? car.warrantyKm.toLocaleString()+' km':'—'}` : '—'],
        ['Euro NCAP', (car.ncapStars||car.ncapYear) ? `${nd(car.ncapStars)} ★ (${nd(car.ncapYear)})` : '—']
      ];
      $('#panel-warranty').innerHTML = `<div class="kv">${war.map(([k,v])=>`<div class="item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

      // Open first accordion by default
      toggleAccordion($('#acc-tech').querySelector('.acc-header'));

      // ----- Wishlist hooks -----
      updateWishlistBadge();
      buildWishlistMenu();
      const currentId = car.id || (car.brand && car.model ? `${car.brand}-${car.model}`.toLowerCase().replace(/\s+/g,'-') : 'car');
      const currentTitle = `${car.brand || ''} ${car.model || ''}`.trim();
      setHeartActive(getWishlist().has(currentId));
      $('#imgHeart').addEventListener('click', ()=> toggleWishlist(currentId, currentTitle));

      // ----- Compare hooks -----
      setCompareActive(loadCompare().has(currentId));
      $('#imgCompare').addEventListener('click', ()=>{
        const meta = {
          brand: car.brand, model: car.model, body: car.body || '',
          fuel: car.fuel || '', gear: car.transmission || '', rating: null,
          price: car.priceFromEur ?? null, img: car.image || ''
        };
        toggleCompare(currentId, meta);
      });

      // ----- Share hook -----
      $('#shareBtn').addEventListener('click', ()=>{
        const url = location.href;
        const title = document.title;
        shareCurrent(url, title);
      });

      // Header dropdown: wishlist (open/remove + OPEN CAR)
      $('#wishlistBtn').addEventListener('click', ()=>{
        const open = $('#wishlist').classList.toggle('open');
        $('#wishlistBtn').setAttribute('aria-expanded', open?'true':'false');
      });
      document.addEventListener('click', (e)=>{
        if(!$('#wishlist').contains(e.target)){ $('#wishlist').classList.remove('open'); $('#wishlistBtn').setAttribute('aria-expanded','false'); }
      });
      document.addEventListener('keydown', (e)=>{
        if(e.key==='Escape'){ $('#wishlist').classList.remove('open'); $('#wishlistBtn').setAttribute('aria-expanded','false'); }
      });
      // Make wishlist items clickable to open the car
      $('#wishlistItems').addEventListener('click', (e)=>{
        const removeBtn = e.target.closest('[data-remove]');
        if (removeBtn) {
          toggleWishlist(removeBtn.getAttribute('data-remove'));
          return;
        }
        const item = e.target.closest('.wish-item');
        if (item) {
          const id = item.getAttribute('data-id');
          if (id) location.href = `cars.html?id=${encodeURIComponent(id)}`;
        }
      });
      $('#clearWishlist').addEventListener('click', ()=>{
        localStorage.setItem(WISHLIST_KEY, '[]');
        updateWishlistBadge(); buildWishlistMenu(); setHeartActive(false); showToast('Wishlist cleared');
      });

      // Build/refresh header compare UI
      updateCompareBadge();
      buildCompareMenu();
    })();
  </script>

  <script>
const BACKEND = "http://localhost:3000";

function escapeHtml(s){ if(s==null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function renderCarSpecs() {
  let car = null;
  try {
    const stored = localStorage.getItem("selectedCar");
    if (stored) car = JSON.parse(stored);
  } catch (e){ car = null; }

  // fallback to URL params if no stored object
  if (!car) {
    const params = new URLSearchParams(window.location.search);
    const brand = params.get("brand");
    const model = params.get("model");
    if (brand && model) {
      try {
        const res = await fetch(`${BACKEND}/api/explore?brand=${encodeURIComponent(brand)}&model=${encodeURIComponent(model)}`);
        if (res.ok) car = await res.json();
      } catch (err) {
        console.warn("Specs fetch failed:", err);
      }
    }
  }

  // If still no car, show friendly message
  if (!car) {
    const el = document.getElementById("specs-root");
    if (el) el.innerHTML = "<p>No car selected. Please go back to explore and click a card.</p>";
    return;
  }

  // render into your page - put fields where you like or into a container id="specs-root"
  const root = document.getElementById("specs-root") || document.body;
  const html = `
    <h1>${escapeHtml(car.brand)} ${escapeHtml(car.model)}</h1>
    <img src="${escapeHtml(car.image || car.carImage || '')}" alt="" style="max-width:600px;width:100%;height:auto;border-radius:8px;">
    <h3>Key specs</h3>
    <ul>
      <li>Price: ${escapeHtml(car.price || 'N/A')}</li>
      <li>Power: ${escapeHtml(car.power || 'N/A')}</li>
      <li>Torque: ${escapeHtml(car.torque || 'N/A')}</li>
      <li>0-100 km/h: ${escapeHtml(car['0-100 km/h'] || car.zeroToHundred || 'N/A')}</li>
      <li>Top speed: ${escapeHtml(car['top speed'] || car.topSpeed || 'N/A')}</li>
      <li>Fuel: ${escapeHtml(car.fuel || 'N/A')}</li>
    </ul>
  `;
  root.innerHTML = html;

  // optional: clear selectedCar so back button won't reuse stale object
  try { localStorage.removeItem("selectedCar"); } catch(_) {}
}

document.addEventListener("DOMContentLoaded", renderCarSpecs);
</script>
