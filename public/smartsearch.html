<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeloValue: Smart Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: black;
    overflow: hidden;
}

#camera-feed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
}

.header {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
    margin-top: 1rem;
}

.header-card {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 0.75rem 1rem;
    color: white;
    text-align: center;
    max-width: 95%;
}

.header-top {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
}

.header-top button {
    background: rgba(255,255,255,0.1);
    padding: 0.25rem 0.75rem;
    color: white;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    cursor: pointer;
    transition: 0.25s;
}

.header-top button:hover {
    background: rgba(255,255,255,0.2);
}

.torch-btn {
    position: absolute;
    top: 1rem;
    left: 1rem;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    cursor: pointer;
    z-index: 2;
    transition: 0.25s;
}

.torch-btn:hover {
    background: rgba(0,0,0,0.6);
}

.footer {
    width: 100%;
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
}

.footer-card {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 95%;
}

button.action-btn {
    border-radius: 12px;
    font-weight: 600;
    transition: 0.25s;
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    padding: 0.5rem 1.25rem;
    margin: 0.5rem;
    cursor: pointer;
    color: white;
}

button.capture-btn {
    background: linear-gradient(90deg,#4b82ff,#2b5cff);
}

button.capture-btn:hover {
    background: linear-gradient(90deg,#5b93ff,#3a6aff);
    transform: translateY(-2px);
}

button.restart-btn {
    background: rgba(255,255,255,0.1);
}

button.restart-btn:hover {
    background: rgba(255,255,255,0.2);
}

#status-message {
    margin-top: 0.5rem;
    text-align: center;
    color: #cbd5e1;
}

#result-display {
    display: none;
    margin-top: 0.5rem;
    color: #88ffc9;
    text-align: center;
    font-weight: 500;
}

#capture-canvas, #captured-image { display: none; }
</style>
</head>
<body>

<video id="camera-feed" autoplay playsinline></video>

<div class="overlay">

  <!-- Header -->
  <div class="header">
    <div class="header-card">
      <div class="header-top">
        <button id="back-btn">← Back</button>
        <span></span> <!-- empty center to align -->
      </div>
      <h1 class="text-xl font-bold text-indigo-400">VeloValue: Smart Search</h1>
      <p class="text-sm text-gray-300">Use your camera to identify a car's make & model</p>
      <div id="status-message">Initializing camera...</div>
    </div>
  </div>

  <!-- Torch button -->
  <div class="torch-btn" id="torch-btn">🔦</div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-card">
      <button id="capture-btn" class="action-btn capture-btn">Capture Photo</button>
      <button id="reset-btn" class="action-btn restart-btn" style="display:none;">Restart</button>
      <div id="result-display"></div>
    </div>
  </div>
</div>

<canvas id="capture-canvas"></canvas>
<img id="captured-image" alt="Captured Car Image">

<script>
const videoElement = document.getElementById('camera-feed');
const canvasElement = document.getElementById('capture-canvas');
const capturedImageEl = document.getElementById('captured-image');
const captureBtn = document.getElementById('capture-btn');
const resetBtn = document.getElementById('reset-btn');
const torchBtn = document.getElementById('torch-btn');
const statusMessageEl = document.getElementById('status-message');
const resultDisplayEl = document.getElementById('result-display');
const backBtn = document.getElementById('back-btn');

let videoStream = null;
let isTorchOn = false;

function setStatus(msg) { statusMessageEl.textContent = msg; }

async function startCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    videoElement.srcObject = videoStream;
    videoElement.play();
    captureBtn.disabled = false;
    setStatus("Camera active. Point at a car and click 'Capture Photo'.");
  } catch (err) {
    console.error(err);
    setStatus("Error accessing camera. Check permissions.");
  }
}

async function captureImage() {
  if (!videoStream) return;
  const ctx = canvasElement.getContext('2d');
  canvasElement.width = videoElement.videoWidth;
  canvasElement.height = videoElement.videoHeight;
  ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

  const dataUrl = canvasElement.toDataURL('image/jpeg', 0.98);
  const base64Image = dataUrl.split(',')[1];

  capturedImageEl.src = dataUrl;
  capturedImageEl.style.display = 'block';
  videoElement.style.display = 'none';
  captureBtn.style.display = 'none';
  resetBtn.style.display = 'inline-block';

  setStatus("Image captured. Analyzing...");
  await sendToGemini(base64Image);
}

async function sendToGemini(base64Image) {
  const API_MODEL = 'gemini-2.5-flash-preview-09-2025';
  const apiKey = "YOUR_API_KEY_HERE";
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${apiKey}`;

  const systemPrompt = "You are an expert automotive analyst. Identify the car Make, Model, Year. Be concise.";
  const userQuery = "Identify the car in the image with any visible features.";

  const payload = {
    contents: [{
      role: "user",
      parts: [
        { text: userQuery },
        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
      ]
    }],
    systemInstruction: { parts: [{ text: systemPrompt }] }
  };

  resultDisplayEl.style.display = 'none';
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    const candidate = result.candidates?.[0];
    if (candidate?.content?.parts?.[0]?.text) {
      resultDisplayEl.textContent = candidate.content.parts[0].text;
      resultDisplayEl.style.display = 'block';
      setStatus("Car identified successfully!");
    } else {
      setStatus("The AI could not confidently identify the car.");
    }
  } catch (err) {
    console.error(err);
    setStatus("Failed to identify car. Try again.");
  }
}

// Torch toggle
async function toggleTorch() {
  if (!videoStream) return;
  const track = videoStream.getVideoTracks()[0];
  if (!track) return;
  try {
    const imageCapture = new ImageCapture(track);
    const capabilities = await imageCapture.getPhotoCapabilities();
    if (!capabilities.torch) { alert("Torch not available."); return; }
    isTorchOn = !isTorchOn;
    await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
  } catch (err) {
    console.error(err);
    alert("Torch not supported.");
  }
}

// Back button
backBtn.addEventListener('click', () => history.back());

captureBtn.addEventListener('click', captureImage);
resetBtn.addEventListener('click', () => location.reload());
torchBtn.addEventListener('click', toggleTorch);

window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>
