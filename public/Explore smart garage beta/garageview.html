<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VeloValue - Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --text: #fff;
  --accent: #1db954;
}

/* ===== Reset & Base ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
html, body { height:100%; background: linear-gradient(135deg, #0a0a0a, #1e1e1e); color:#fff; }

/* ===== Header ===== */
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 2rem; position: fixed; width: 100%; top: 0; background: rgba(0,0,0,0.6);
  z-index: 2000; border-bottom: 1px solid #333;
}
.header-left { display:flex; align-items:center; gap:15px; }
.header-right { display:flex; align-items:center; gap:15px; }
header h1 a { font-size:1.8rem; font-weight:800; color:var(--text); text-decoration:none; }

/* Desktop nav */
nav.desktop-nav { display:flex; gap:20px; }
nav.desktop-nav a { color:var(--text); font-weight:600; font-size:16px; text-decoration:none; white-space:nowrap; }
nav.desktop-nav a:hover { text-decoration:underline; }

/* Language select */
.language-select { position:relative; }
.language-select select {
  appearance:none; background:#111; color:var(--text); border:1px solid #333; border-radius:6px;
  padding:6px 30px 6px 10px; font-size:0.9rem; cursor:pointer;
}

/* Auth button */
#authSection .text-btn { display:inline-flex; background:var(--text); color:var(--bg); border:none; border-radius:999px; padding:8px 16px; font-weight:600; cursor:pointer; align-items:center; justify-content:center; }
#authSection .icon-btn { display:none; }

/* Hamburger */
.hamburger { font-size:1.8rem; background:none; border:none; color:var(--text); cursor:pointer; display:none; align-items:center; justify-content:center; z-index:2200; }

/* Mobile menu */
.menu {
  position: fixed; top:0; left:-300px; width:300px; height:100vh; background: rgba(17,17,17,0.95);
  border-right:1px solid rgba(255,255,255,0.12); padding:3rem 2rem; display:flex; flex-direction:column; gap:2rem;
  transition:left 0.3s ease; z-index:2100; backdrop-filter:blur(10px); border-radius:0 1rem 1rem 0;
}
.menu.active { left:0; }
.menu a { color:var(--text); font-size:1.6rem; font-weight:800; text-decoration:none; }

/* Menu overlay */
.menu-overlay { position:fixed; inset:0; background: rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity 0.3s ease; z-index:2050; }
.menu-overlay.active { opacity:1; pointer-events:auto; }

/* Responsive header */
@media(max-width:1024px){ nav.desktop-nav{display:none;} .hamburger{display:flex; width:40px; height:40px;} }
@media(max-width:768px){
  #authSection .text-btn{display:none;} #authSection .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; font-size:1.2rem; background:var(--text); color:var(--bg); border:none; cursor:pointer; transition:transform 0.2s ease;}
  #authSection .icon-btn:active{transform:scale(0.95);}
  .language-select{width:40px; height:40px; border-radius:50%; background:#111; border:1px solid #fff; display:flex; align-items:center; justify-content:center;}
  .language-select::before{content:"🌐"; font-size:1.2rem; color:#fff; position:absolute;}
  .language-select select{opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer;}
}

/* ===== Garage Header ===== */
.garage-header {
  display:grid; grid-template-columns:1fr 500px 1fr; gap:20px; align-items:start;
  padding:120px 40px 20px; width:100%; z-index:2;
}
.garage-left,.garage-right { display:flex; flex-direction:column; gap:12px; }
.garage-left{align-items:flex-start;} .garage-right{align-items:flex-end;}

/* Capsules */
.capsule-search { background:rgba(255,255,255,0.04); color:#fff; font-size:15px; padding:10px 18px; border-radius:50px; border:1px solid rgba(255,255,255,0.06); }
.add-car-pill { background:rgba(76,242,160,0.08); color:#4cf2a0; font-weight:700; font-size:16px; padding:10px 18px; border-radius:50px; border:1px solid rgba(76,242,160,0.2); cursor:pointer; }
.add-car-pill:hover{background:rgba(76,242,160,0.18);}
.garage-level-pill { background:rgba(242,201,76,0.15); color:#f2c94c; font-weight:700; padding:10px 20px; border-radius:50px; border:1px solid rgba(242,201,76,0.5);}
.view-toggle select { font-size:16px; padding:8px 12px; border-radius:8px; color:#fff; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); }

/* ===== Container ===== */
.slider-container { position:relative; display:flex; justify-content:center; width:100%; min-height:60vh; padding-bottom:40px; }
/* Card view */
.card-slider.right-panel { border-radius:20px; backdrop-filter:blur(20px); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:24px 28px; width:500px; height:600px; transition:0.45s ease; opacity:0; transform:translateY(18px); margin-top:-80px; }
.card-slider.show { opacity:1; transform:translateY(0); }
/* Car Info */
.car-header { display:flex; align-items:flex-start; gap:20px; margin-bottom:18px; }
.car-info { display:flex; flex-direction:column; gap:4px; }
.car-logo { width:100px; height:auto; }
.car-name { font-size:24px; font-weight:900; color:#f2c94c; }
.car-model { font-size:18px; font-weight:600; color:#ccc; }
.fuel-pill { display:inline-block; padding:4px 12px; border-radius:20px; background:rgba(242,201,76,0.15); border:1px solid rgba(242,201,76,0.4); color:#f2c94c; font-size:13px; font-weight:600; margin-top:4px; }
/* Car image */
.car-image-box { width:100%; height:340px; border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.02); border:2px solid rgba(255,255,255,0.08); }
.car-image { max-width:100%; max-height:100%; object-fit:contain; }
/* Plate */
.italian-plate {
  position: relative; /* add this */
  margin:28px auto 0;
  width:360px;
  height:60px;
  background:#fff;
  border-radius:8px;
  border:1px solid #ccc;
  font-family:'OCR A Std',monospace;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  color:#000;
  letter-spacing:6px;
}

.italian-plate::before { content:'I'; position:absolute; left:0; width:40px; height:100%; background:#003399; color:#fff; display:flex; align-items:center; justify-content:center; border-top-left-radius:8px; border-bottom-left-radius:8px; }
.italian-plate::after { content:'RM'; position:absolute; right:0; width:40px; height:100%; background:#003399; color:#fff; display:flex; align-items:center; justify-content:center; border-top-right-radius:8px; border-bottom-right-radius:8px; }
/* Arrows */
.slider-arrow { position:absolute; top:50%; transform:translateY(-50%); font-size:44px; font-weight:bold; color:#f2c94c; background:rgba(0,0,0,0.45); border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 0.25s; }
.slider-arrow.left { left:10%; }
.slider-arrow.right { right:10%; }
/* Tiles */
.tiles-view { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; }
.tile-card { width:250px; padding:15px; border-radius:20px; backdrop-filter:blur(20px); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);}
.tile-card img { width:100%; height:150px; object-fit:contain; border-radius:10px; margin-bottom:10px; }
.tile-info { display:flex; gap:10px; align-items:flex-start; }
.tile-info .car-logo { width:50px; height:auto; }
.tile-info .car-meta { display:flex; flex-direction:column; gap:4px; }
/* List */
.list-view { display:flex; flex-direction:column; gap:15px; width:80%; margin:0 auto; padding:20px 0; }
.list-card { display:flex; align-items:center; gap:20px; padding:15px; border-radius:20px; backdrop-filter:blur(20px); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);}
.list-card .car-logo { width:60px; height:auto; }
.list-card .car-meta { display:flex; align-items:center; gap:15px; }
/* Responsive */
@media(max-width:900px){ .garage-header{grid-template-columns:1fr; padding:120px 20px 20px;} .card-slider{width:90%; height:auto;} .slider-arrow.left{left:4%;} .slider-arrow.right{right:4%;} }
@media(max-width:600px){ .card-slider{padding:16px; margin-top:-60px;} .garage-left input { width:100%; } .tiles-view { gap:12px; } .tile-card { width:45%; } .list-view { width:95%; } .italian-plate { width:90%; font-size:20px; } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <h1><a href="/homepage.html">VeloValue</a></h1>
  </div>
  <div class="header-right">
    <nav class="desktop-nav">
      <a href="/homepage.html">HOME</a>
      <a href="/Explore new cars beta/explorenewcars.html">EXPLORE NEW CARS</a>
      <a href="/Explore smart garage beta/smartgarage.html">SMART GARAGE</a>
      <a href="/Velocharge beta/velocharge.html">VELOCHARGE</a>
    </nav>
    <div class="language-select">
      <select id="languageSelect">
        <option value="en">🇬🇧 English</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </div>
    <div id="authSection">
      <button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>
    </div>
  </div>
</header>

<nav class="menu" id="hamburgerMenu" aria-hidden="true">
  <a href="/homepage.html">HOME</a>
  <a href="/Explore new cars beta/explorenewcars.html">EXPLORE NEW CARS</a>
  <a href="/Explore smart garage beta/smartgarage.html">SMART GARAGE</a>
  <a href="/Velocharge beta/velocharge.html">DISCOVER VELOCHARGE</a>
  <a href="#careers">WORK WITH US</a>
  <a href="#about">ABOUT US</a>
</nav>
<div class="menu-overlay"></div>

<div class="garage-header">
  <div class="garage-left">
    <input type="text" placeholder="Search for your car…" class="capsule-search" id="searchBox"/>
    <div class="add-car-pill" id="addCarBtn">+ Add a new car</div>
  </div>
  <div></div>
  <div class="garage-right">
    <div id="garage-level" class="garage-level-pill"></div>
    <div class="view-toggle">
      <select id="viewMode">
        <option value="card">Card View</option>
        <option value="tiles">Tiles View</option>
        <option value="list">List View</option>
      </select>
    </div>
  </div>
</div>

<div id="garageDisplay" class="slider-container"></div>

<script>
// Hamburger toggle
const hamburger = document.querySelector(".hamburger");
const menu = document.getElementById("hamburgerMenu");
const overlay = document.querySelector(".menu-overlay");

hamburger.addEventListener("click", () => {
  const expanded = hamburger.getAttribute("aria-expanded") === "true";
  hamburger.setAttribute("aria-expanded", !expanded);
  menu.classList.toggle("active");
  overlay.classList.toggle("active");
  menu.setAttribute("aria-hidden", !menu.classList.contains("active"));
});
overlay.addEventListener("click", () => { hamburger.click(); });
window.addEventListener("resize", () => { if(window.innerWidth > 1024 && menu.classList.contains("active")) hamburger.click(); });

// Auth button toggle
const authSection = document.getElementById("authSection");
function updateAuthButton() {
  if(window.innerWidth <= 768) {
    authSection.innerHTML = `<button class="icon-btn" onclick="window.location.href='login.html'">👤</button>`;
  } else {
    authSection.innerHTML = `<button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>`;
  }
}
updateAuthButton();
window.addEventListener("resize", updateAuthButton);

// ===== Garage JS =====
let cars = [
  { brand:"Hyundai", model:"i20", fuel:"Petrol", img:"hyundai_i20.jpg", logo:"hyundai_logo.png" },
  { brand:"Fiat", model:"500", fuel:"Hybrid", img:"abarth_500.jpg", logo:"fiat_logo.png" },
  { brand:"BMW", model:"X5", fuel:"Diesel", img:"bmw_x5.jpg", logo:"bmw_logo.png" },
  { name:"Add a new car", img:"", logo:"", isAddNew:true }
];
const WIRE_KEYS = { DETAILS:'vv_selected_car' };
const PATHS = { DETAILS:'cardetailsview.html' };
const ADD_CAR_PATH='garagesearch.html';
function goToAddCar(){ location.href=ADD_CAR_PATH; }
function slugify(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function ensureIds(){ cars = cars.map((c,i)=>c.isAddNew?c:{...c,id:c.id||`${slugify(c.brand||c.name||'car')}-${slugify(c.model||String(i+1))}`}); }
ensureIds();
function normalizeFromGarage(car){ return { id:car.id, brand:car.brand||car.name||'', model:car.model??null, fuel:car.fuel??null, image:car.img||'', logo:car.logo||'' }; }
function wireToPage(car,{path,key,pick}={}){ const normalized=normalizeFromGarage(car); let payload=normalized; if(Array.isArray(pick)&&pick.length){ payload={}; for(const k of pick) payload[k]=normalized[k]??null; } sessionStorage.setItem(key,JSON.stringify(payload)); const url=new URL(path,location.href); url.searchParams.set('id',normalized.id); location.href=url.toString(); }
function openDetails(car){ wireToPage(car,{path:PATHS.DETAILS,key:WIRE_KEYS.DETAILS,pick:['id','brand','model','image','logo','fuel']}); }

const garageDisplay=document.getElementById("garageDisplay");
const viewModeSelect=document.getElementById("viewMode");
const garageLevel=document.getElementById("garage-level");
const addCarBtn=document.getElementById("addCarBtn");
const searchBox=document.getElementById("searchBox");

let currentIndex=0;
let filteredCars=[...cars];
addCarBtn.addEventListener("click", goToAddCar);

function renderCarCard(car){
  return `
    <div class="car-header">
      ${car.logo?`<img src="${car.logo}" class="car-logo">`:""}
      <div class="car-info">
        <div class="car-name">${car.brand||car.name}</div>
        ${car.model?`<div class="car-model">${car.model}</div>`:""}
        ${car.fuel?`<div class="fuel-pill">${car.fuel}</div>`:""}
      </div>
    </div>
    <div class="car-image-box">
      ${car.img?`<img src="${car.img}" class="car-image">`:`<div style="color:#bbb;">No image</div>`}
    </div>
    <div class="italian-plate">AA 111AA</div>`;
}

function renderCardSlider(list=filteredCars){
  garageDisplay.className="slider-container"; garageDisplay.innerHTML="";
  if(list.length===0||(list.length===1 && list[0].isAddNew)){ garageDisplay.innerHTML="<div style='text-align:center;color:#ccc;padding:40px;'>No cars found</div>"; garageLevel.textContent="Garage Level - 0"; return; }
  const card=document.createElement("div"); card.className="card-slider right-panel";
  const car=list[currentIndex];
  if(car.isAddNew){ card.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;"><div style="text-align:center;"><div style="font-size:32px;font-weight:900;color:#f2c94c;margin-bottom:10px;">+ Add a new car</div><div style="font-size:14px;color:#ccc;">Click to add car details</div></div></div>`; card.addEventListener("click", goToAddCar); }
  else { card.innerHTML=renderCarCard(car); card.dataset.id=car.id; card.tabIndex=0; card.style.cursor='pointer'; card.addEventListener('click',()=>openDetails(car)); card.addEventListener('keydown',e=>{if(e.key==='Enter') openDetails(car);}); }
  garageDisplay.appendChild(card);

  const prev=document.createElement("button"); prev.className="slider-arrow left"; prev.innerHTML="&lt;"; prev.style.display=currentIndex===0?"none":"flex"; prev.addEventListener("click",()=>{if(currentIndex>0){currentIndex--;animateCardChange(list);}});
  const next=document.createElement("button"); next.className="slider-arrow right"; next.innerHTML="&gt;"; next.style.display=currentIndex===list.length-1?"none":"flex"; next.addEventListener("click",()=>{if(currentIndex<list.length-1){currentIndex++;animateCardChange(list);}});
  garageDisplay.appendChild(prev); garageDisplay.appendChild(next);
  requestAnimationFrame(()=>card.classList.add("show"));
  garageLevel.textContent=`Garage Level - ${list.length-1}`;
}
function animateCardChange(list){ const card=document.querySelector(".card-slider"); if(!card)return; card.classList.remove("show"); setTimeout(()=>renderCardSlider(list),260); }

function renderTiles(list=filteredCars){
  garageDisplay.className="tiles-view"; garageDisplay.innerHTML="";
  list.forEach(car=>{
    const tile=document.createElement("div"); tile.className="tile-card";
    if(car.isAddNew){ tile.innerHTML=`<div class="car-name">+ Add a new car</div>`; tile.addEventListener("click",goToAddCar);}
    else{ tile.innerHTML=`${car.img?`<img src="${car.img}" alt="${car.name}">`:`<div style="height:150px;display:flex;align-items:center;justify-content:center;color:#bbb">No image</div>`}<div class="tile-info">${car.logo?`<img src="${car.logo}" class="car-logo">`:""}<div class="car-meta"><span class="car-name">${car.brand}</span>${car.model?`<span class="car-model">${car.model}</span>`:""}${car.fuel?`<span class="fuel-pill">${car.fuel}</span>`:""}</div></div>`; tile.dataset.id=car.id; tile.tabIndex=0; tile.style.cursor='pointer'; tile.addEventListener("click",()=>openDetails(car)); tile.addEventListener("keydown",e=>{if(e.key==='Enter') openDetails(car);});}
    garageDisplay.appendChild(tile);
  });
  garageLevel.textContent=`Garage Level - ${list.length-1}`;
}
function renderList(list=filteredCars){
  garageDisplay.className="list-view"; garageDisplay.innerHTML="";
  list.forEach(car=>{
    const item=document.createElement("div"); item.className="list-card";
    if(car.isAddNew){ item.innerHTML=`<div class="car-name">+ Add a new car</div>`; item.addEventListener("click",goToAddCar);}
    else{ item.innerHTML=`${car.logo?`<img src="${car.logo}" class="car-logo">`:""}<div class="car-meta"><span class="car-name">${car.brand}</span>${car.model?`<span class="car-model">${car.model}</span>`:""}${car.fuel?`<span class="fuel-pill">${car.fuel}</span>`:""}</div>`; item.dataset.id=car.id; item.tabIndex=0; item.style.cursor='pointer'; item.addEventListener("click",()=>openDetails(car)); item.addEventListener("keydown",e=>{if(e.key==='Enter') openDetails(car);}); }
    garageDisplay.appendChild(item);
  });
  garageLevel.textContent=`Garage Level - ${list.length-1}`;
}
function renderView(mode){ if(mode==="card") renderCardSlider(); if(mode==="tiles") renderTiles(); if(mode==="list") renderList(); }

searchBox.addEventListener("input",e=>{ const q=e.target.value.toLowerCase(); filteredCars=cars.filter(c=>c.isAddNew||(c.brand||c.name).toLowerCase().includes(q)); currentIndex=0; renderView(viewModeSelect.value); });
viewModeSelect.addEventListener("change",()=>renderView(viewModeSelect.value));
renderView("card");
</script>

</body>
</html>
