<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VeloValue - Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --text: #fff;
  --accent: #1db954;
}

/* ===== Reset & Base ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
html, body { height:100%; background: linear-gradient(135deg, #0a0a0a, #1e1e1e); color:#fff; }

/* ===== Header ===== */
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 2rem; position: fixed; width: 100%; top: 0; background: rgba(0,0,0,0.6);
  z-index: 2000; border-bottom: 1px solid #333;
}
.header-left { display:flex; align-items:center; gap:15px; }
.header-right { display:flex; align-items:center; gap:15px; }
header h1 a { font-size:1.8rem; font-weight:800; color:var(--text); text-decoration:none; }

/* Desktop nav */
nav.desktop-nav { display:flex; gap:20px; }
nav.desktop-nav a { color:var(--text); font-weight:600; font-size:16px; text-decoration:none; white-space:nowrap; }
nav.desktop-nav a:hover { text-decoration:underline; }

/* Language select */
.language-select { position:relative; }
.language-select select {
  appearance:none; background:#111; color:var(--text); border:1px solid #333; border-radius:6px;
  padding:6px 30px 6px 10px; font-size:0.9rem; cursor:pointer;
}

/* Auth button */
#authSection .text-btn { display:inline-flex; background:var(--text); color:var(--bg); border:none; border-radius:999px; padding:8px 16px; font-weight:600; cursor:pointer; align-items:center; justify-content:center; }
#authSection .icon-btn { display:none; }

/* Hamburger */
.hamburger {
  font-size:1.8rem; background:none; border:none; color:var(--text); cursor:pointer;
  display:none; align-items:center; justify-content:center; z-index:2200; width:40px; height:40px;
}

/* Mobile menu */
.menu {
  position: fixed; top:0; left:-300px; width:300px; height:100vh; background: rgba(17,17,17,0.95);
  border-right:1px solid rgba(255,255,255,0.12); padding:3rem 2rem; display:flex; flex-direction:column; gap:2rem;
  transition:left 0.3s ease; z-index:2100; backdrop-filter:blur(10px); border-radius:0 1rem 1rem 0;
}
.menu.active { left:0; }
.menu a { color:var(--text); font-size:1.6rem; font-weight:800; text-decoration:none; }

/* Menu overlay */
.menu-overlay { position:fixed; inset:0; background: rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity 0.3s ease; z-index:2050; }
.menu-overlay.active { opacity:1; pointer-events:auto; }

/* Responsive header + Hamburger morph to X (mobile only) */
@media(max-width:1024px){
  nav.desktop-nav{display:none;}
  .hamburger{display:flex;}

  /* Morph hamburger to X */
  .hamburger { position: relative; font-size: 0; } /* hide the ☰ glyph */
  .hamburger::before,
  .hamburger::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 22px;
    height: 2px;
    background: currentColor;
    transform: translateX(-50%);
    transition: transform .25s ease, top .25s ease, opacity .2s ease;
  }
  .hamburger::before { top: calc(50% - 6px); } /* top line */
  .hamburger::after  { top: calc(50% + 6px); } /* bottom line */
  /* middle line via background */
  .hamburger {
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-position: center;
    background-size: 22px 2px;
  }
  .hamburger.is-active { background-size: 0 0; } /* hide the middle line */
  .hamburger.is-active::before { top: 50%; transform: translateX(-50%) rotate(45deg); }
  .hamburger.is-active::after  { top: 50%; transform: translateX(-50%) rotate(-45deg); }
}

@media(max-width:768px){
  #authSection .text-btn{display:none;}
  #authSection .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%;
    font-size:1.2rem; background:var(--text); color:var(--bg); border:none; cursor:pointer; transition:transform 0.2s ease;
  }
  #authSection .icon-btn:active{transform:scale(0.95);}

  .language-select{
    width:40px; height:40px; border-radius:50%; background:#111; border:1px solid #fff;
    display:flex; align-items:center; justify-content:center;
  }
  .language-select::before{content:"🌐"; font-size:1.2rem; color:#fff; position:absolute;}
  .language-select select{opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer;}
}

/* ===== Garage Header ===== */
.garage-header {
  display:grid; grid-template-columns:1fr 500px 1fr; gap:20px; align-items:start;
  padding:120px 40px 20px; width:100%; z-index:2;
}
.garage-left,.garage-right { display:flex; flex-direction:column; gap:12px; }
.garage-left{align-items:flex-start;} .garage-right{align-items:flex-end;}

/* Capsules */
.capsule-search { background:rgba(255,255,255,0.04); color:#fff; font-size:15px; padding:10px 18px; border-radius:50px; border:1px solid rgba(255,255,255,0.06); }
.add-car-pill { background:rgba(76,242,160,0.08); color:#4cf2a0; font-weight:700; font-size:16px; padding:10px 18px; border-radius:50px; border:1px solid rgba(76,242,160,0.2); cursor:pointer; }
.add-car-pill:hover{background:rgba(76,242,160,0.18);}
.garage-level-pill { background:rgba(242,201,76,0.15); color:#f2c94c; font-weight:700; padding:10px 20px; border-radius:50px; border:1px solid rgba(242,201,76,0.5);}
.view-toggle select { font-size:16px; padding:8px 12px; border-radius:8px; color:#fff; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); }

/* ===== Container ===== */
.slider-container { 
  position:relative; 
  display:flex; 
  justify-content:center; 
  align-items: center;
  width:100%; 
  min-height:70vh; 
  padding: 60px 20px 80px;
  perspective: 2000px;
}

/* Stacked Cards Container */
.card-stack {
  position: relative;
  width: 500px;
  height: 600px;
  transform-style: preserve-3d;
}

/* Card view */
.card-slider.right-panel { 
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  border-radius:20px; 
  backdrop-filter:blur(20px); 
  background:rgba(255,255,255,0.03); 
  border:1px solid rgba(255,255,255,0.08); 
  padding:24px 28px; 
  width:500px; 
  height:600px; 
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  transform-style: preserve-3d;
}

/* Stacked card positions */
.card-slider.position-0 {
  z-index: 100;
  transform: translateX(-50%) translateZ(0px) scale(1);
  opacity: 1;
  filter: brightness(1);
  pointer-events: auto;
}

.card-slider.position-1 {
  z-index: 99;
  transform: translateX(-50%) translateZ(-100px) translateY(30px) scale(0.92);
  opacity: 0.6;
  filter: brightness(0.7);
  pointer-events: none;
}

.card-slider.position-2 {
  z-index: 98;
  transform: translateX(-50%) translateZ(-200px) translateY(60px) scale(0.84);
  opacity: 0.3;
  filter: brightness(0.5);
  pointer-events: none;
}

.card-slider.position-hidden {
  z-index: 97;
  transform: translateX(-50%) translateZ(-300px) translateY(90px) scale(0.76);
  opacity: 0;
  pointer-events: none;
}

.carousel-wrapper {
  position: relative;
  width: 100%;
  max-width: 500px; /* match center column */
  margin: auto;
  height: 560px; /* taller cards */
  perspective: 2000px;
}

.carousel-track {
  position: relative;
  width: 100%;
  height: 100%;
}
</style>
<style>
.carousel-card {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(20,20,25,0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.55s ease;
  pointer-events: none;
  opacity: 0;
}

.carousel-card.center {
  transform: translateZ(0) scale(1);
  opacity: 1;
  pointer-events: auto;
  z-index: 100;
}

.carousel-card.left {
  transform: translateX(-60%) translateZ(-120px) scale(0.92);
  opacity: .55;
}

.carousel-card.right {
  transform: translateX(60%) translateZ(-120px) scale(0.92);
  opacity: .55;
}

.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  font-size: 28px;
  font-weight: 800;
  border: 1px solid rgba(255,255,255,0.4);
  background: linear-gradient(to bottom right, rgba(255,215,0,0.8), rgba(30,30,30,0.8));
  color: black;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: .3s;
  z-index: 200;
}

.carousel-btn:hover {
  scale: 1.08;
}

.carousel-btn.left { left: -18px; }
.carousel-btn.right { right: -18px; }

.add-car {
  text-align: center;
  margin-top: 110px;
}

.add-plus {
  font-size: 50px;
  font-weight: 900;
  color: #f2c94c;
}

.italian-plate {
  max-width: 90%;
  margin: 0 auto;
}

/* Car Info */
.car-header { display:flex; align-items:flex-start; gap:20px; margin-bottom:18px; }
.car-info { display:flex; flex-direction:column; gap:4px; }
.car-logo { width:100px; height:auto; }
.car-name { font-size:24px; font-weight:900; color:#f2c94c; }
.car-model { font-size:18px; font-weight:600; color:#ccc; }
.fuel-pill { display:inline-block; padding:4px 12px; border-radius:20px; background:rgba(242,201,76,0.15); border:1px solid rgba(242,201,76,0.4); color:#f2c94c; font-size:13px; font-weight:600; }
/* Car image */
.car-image-box { width:100%; height:420px; border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.02); border:2px solid rgba(255,255,255,0.08); }
.car-image { max-width:100%; max-height:100%; object-fit:contain; }
/* Plate */
.italian-plate {
  position: relative;
  margin:28px auto 0;
  width:360px;
  height:60px;
  background:#fff;
  border-radius:8px;
  border:1px solid #ccc;
  font-family:'OCR A Std',monospace;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  color:#000;
  letter-spacing:6px;
}

.italian-plate::before { content:'I'; position:absolute; left:0; width:40px; height:100%; background:#003399; color:#fff; display:flex; align-items:center; justify-content:center; border-top-left-radius:8px; border-bottom-left-radius:8px; }
.italian-plate::after { content:'RM'; position:absolute; right:0; width:40px; height:100%; background:#003399; color:#fff; display:flex; align-items:center; justify-content:center; border-top-right-radius:8px; border-bottom-right-radius:8px; }
/* Arrows */
.slider-arrow { 
  position:absolute; 
  top:50%; 
  transform:translateY(-50%); 
  font-size:44px; 
  font-weight:bold; 
  color:#f2c94c; 
  background:rgba(0,0,0,0.45); 
  border-radius:50%; 
  width:56px; 
  height:56px; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  cursor:pointer; 
  transition:all 0.25s;
  z-index: 200;
  border: none;
}
.slider-arrow:hover {
  background: rgba(242,201,76,0.3);
  transform: translateY(-50%) scale(1.1);
}
.slider-arrow.left { left:10%; }
.slider-arrow.right { right:10%; }
/* Tiles */
.tiles-view { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; }
.tile-card { width:250px; padding:15px; border-radius:20px; backdrop-filter:blur(20px); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);}
.tile-card img { width:100%; height:150px; object-fit:contain; border-radius:10px; margin-bottom:10px; }
.tile-info { display:flex; gap:10px; align-items:flex-start; }
.tile-info .car-logo { width:50px; height:auto; }
.tile-info .car-meta { display:flex; flex-direction:column; gap:4px; }
/* List */
.list-view { display:flex; flex-direction:column; gap:15px; width:80%; margin:0 auto; padding:20px 0; }
.list-card { display:flex; align-items:center; gap:20px; padding:15px; border-radius:20px; backdrop-filter:blur(20px); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);}
.list-card .car-logo { width:60px; height:auto; }
.list-card .car-meta { display:flex; align-items:center; gap:15px; }

/* Responsive */
@media(max-width:900px){ 
  .garage-header{grid-template-columns:1fr; padding:120px 20px 20px;} 
  .card-stack, .card-slider{width:90%; max-width:400px; height:auto; min-height:500px;} 
  .slider-arrow.left{left:4%;} 
  .slider-arrow.right{right:4%;} 
}
@media(max-width:600px){ 
  .card-slider{padding:16px;} 
  .garage-left input { width:100%; } 
  .tiles-view { gap:12px; } 
  .tile-card { width:45%; } 
  .list-view { width:95%; } 
  .italian-plate { width:90%; font-size:20px; }
  .card-stack { height: 500px; }
}
</style>

<style>
/* 1) Side cards a little closer to the main card */
.carousel-card.left  { transform: translateX(-45%) translateZ(-80px) scale(0.95); opacity: .7; }
.carousel-card.right { transform: translateX( 45%) translateZ(-80px) scale(0.95); opacity: .7; }

/* 2) Dots indicator */
.carousel-dots { display:flex; gap:8px; justify-content:center; align-items:center; margin-top:14px; }
.carousel-dot {
  width:8px; height:8px; border-radius:50%;
  background: rgba(255,255,255,0.35);
  border: 1px solid rgba(255,255,255,0.5);
  cursor:pointer;
  transition: transform .2s ease, background-color .2s ease, opacity .2s ease, border-color .2s ease;
}
.carousel-dot:hover { transform: scale(1.15); }
.carousel-dot.active { background:#f2c94c; border-color: rgba(242,201,76,0.8); transform: scale(1.25); }

/* 3) Stop at ends: show disabled state for arrows (kept for compatibility) */
.carousel-btn:disabled { opacity:.35; filter:grayscale(20%); cursor:default; pointer-events:none; }

/* 4) Drag/touch affordance */
.carousel-wrapper, .carousel-track { touch-action: pan-y; }
.carousel-wrapper.dragging { cursor: grabbing; }
.carousel-wrapper.dragging .carousel-card.center { transform: translateZ(0) scale(0.985); }

/* 5) Make mobile layout friendlier: pills 50/50 below Add, then cards */

/* 6) Extra polish transitions */

/* Fix non-standard scale on hover by overriding with transform */

<style>

<script>
// Hamburger toggle + X morph (mobile), with desktop fallback glyph
const hamburger = document.querySelector(".hamburger");
const menu = document.getElementById("hamburgerMenu");
const overlay = document.querySelector(".menu-overlay");

function openMenu(){
  hamburger.setAttribute("aria-expanded","true");
  hamburger.classList.add("is-active");
  if (window.innerWidth > 1024) hamburger.textContent = "✕";
  menu.classList.add("active");
  overlay.classList.add("active");
  menu.setAttribute("aria-hidden","false");
}
function closeMenu(){
  hamburger.setAttribute("aria-expanded","false");
  hamburger.classList.remove("is-active");
  if (window.innerWidth > 1024) hamburger.textContent = "☰";
  menu.classList.remove("active");
  overlay.classList.remove("active");
  menu.setAttribute("aria-hidden","true");
}
function toggleMenu(){
  if (menu.classList.contains("active")) closeMenu();
  else openMenu();
}

hamburger.addEventListener("click", toggleMenu);
overlay.addEventListener("click", closeMenu);
window.addEventListener("resize", () => {
  if(window.innerWidth > 1024 && menu.classList.contains("active")) closeMenu();
});

// Auth button toggle
const authSection = document.getElementById("authSection");
function updateAuthButton() {
  if(window.innerWidth <= 768) {
    authSection.innerHTML = `<button class="icon-btn" onclick="window.location.href='login.html'">👤</button>`;
  } else {
    authSection.innerHTML = `<button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>`;
  }
}
updateAuthButton();
window.addEventListener("resize", updateAuthButton);

// ===== Garage JS =====
let cars = [
  { brand:"Hyundai", model:"i20", fuel:"Petrol", img:"hyundai_i20.jpg", logo:"hyundai_logo.png" },
  { brand:"Fiat", model:"500", fuel:"Hybrid", img:"abarth_500.jpg", logo:"fiat_logo.png" },
  { brand:"BMW", model:"X5", fuel:"Diesel", img:"bmw_x5.jpg", logo:"bmw_logo.png" },
  { name:"Add a new car", img:"", logo:"", isAddNew:true }
];
const WIRE_KEYS = { DETAILS:'vv_selected_car' };
const PATHS = { DETAILS:'cardetailsview.html' };
const ADD_CAR_PATH='garagesearch.html';
function goToAddCar(){ location.href=ADD_CAR_PATH; }
function slugify(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function ensureIds(){ cars = cars.map((c,i)=>c.isAddNew?c:{...c,id:c.id||`${slugify(c.brand||c.name||'car')}-${slugify(c.model||String(i+1))}`}); }
ensureIds();
function normalizeFromGarage(car){ return { id:car.id, brand:car.brand||car.name||'', model:car.model??null, fuel:car.fuel??null, image:car.img||'', logo:car.logo||'' }; }
function wireToPage(car,{path,key,pick}={}){ const normalized=normalizeFromGarage(car); let payload=normalized; if(Array.isArray(pick)&&pick.length){ payload={}; for(const k of pick) payload[k]=normalized[k]??null; } sessionStorage.setItem(key,JSON.stringify(payload)); const url=new URL(path,location.href); url.searchParams.set('id',normalized.id); location.href=url.toString(); }
function openDetails(car){ wireToPage(car,{path:PATHS.DETAILS,key:WIRE_KEYS.DETAILS,pick:['id','brand','model','image','logo','fuel']}); }

const garageDisplay=document.getElementById("garageDisplay");
const viewModeSelect=document.getElementById("viewMode");
const garageLevel=document.getElementById("garage-level");
const addCarBtn=document.getElementById("addCarBtn");
const searchBox=document.getElementById("searchBox");

let currentIndex=0;
let filteredCars=[...cars];
addCarBtn.addEventListener("click", goToAddCar);

function renderCarCard(car){
  return `
    <div class="car-header">
      ${car.logo?`<img src="${car.logo}" class="car-logo">`:""}
      <div class="car-info">
        <div class="car-name">${car.brand||car.name}</div>
        ${car.model?`<div class="car-model">${car.model}</div>`:""}
        ${car.fuel?`<div class="fuel-pill">${car.fuel}</div>`:""}
      </div>
    </div>
    <div class="car-image-box">
      ${car.img?`<img src="${car.img}" class="car-image">`:`<div style="color:#bbb;">No image</div>`}
    </div>
    <div class="italian-plate">AA 111AA</div>`;
}

function renderCardSlider(list = filteredCars) {
  garageDisplay.className = "carousel-wrapper";
  garageDisplay.innerHTML = "";

  if (list.length === 0 || (list.length === 1 && list[0].isAddNew)) {
    garageDisplay.innerHTML = "<div style='text-align:center;color:#ccc;padding:40px;'>No cars found</div>";
    garageLevel.textContent = "Garage Level - 0";
    return;
  }

  const carousel = document.createElement("div");
  carousel.className = "carousel-track";

  const prevIndex = (currentIndex - 1 + list.length) % list.length;
  const nextIndex = (currentIndex + 1) % list.length;

  function makeCard(car, position) {
    const div = document.createElement("div");
    div.className = `carousel-card ${position}`;

    if (car.isAddNew) {
      div.innerHTML = `
      <div class="add-car">
        <div class="add-plus">+</div>
        <div class="add-text">Add new car</div>
      </div>`;
      if (position === "center") div.onclick = goToAddCar;
      return div;
    }

    div.innerHTML = renderCarCard(car);

    if (position === "center") {
      div.tabIndex = 0;
      div.onclick = () => openDetails(car);
      div.onkeydown = e => { if (e.key === "Enter") openDetails(car); };
    }
    return div;
  }

  carousel.appendChild(makeCard(list[prevIndex], "left"));
  carousel.appendChild(makeCard(list[currentIndex], "center"));
  carousel.appendChild(makeCard(list[nextIndex], "right"));

  garageDisplay.appendChild(carousel);

  const prevBtn = document.createElement("button");
  prevBtn.className = "carousel-btn left";
  prevBtn.innerHTML = "‹";
  prevBtn.onclick = () => {
    currentIndex = prevIndex;
    renderCardSlider(list);
  };

  const nextBtn = document.createElement("button");
  nextBtn.className = "carousel-btn right";
  nextBtn.innerHTML = "›";
  nextBtn.onclick = () => {
    currentIndex = nextIndex;
    renderCardSlider(list);
  };

  garageDisplay.appendChild(prevBtn);
  garageDisplay.appendChild(nextBtn);
  garageLevel.textContent = `Garage Level - ${list.length - 1}`;
}

function updateStackPositions(list) {
  const cards = document.querySelectorAll(".card-slider");
  const arrows = document.querySelectorAll(".slider-arrow");
  
  cards.forEach((card, index) => {
    // Remove position classes
    card.classList.remove("position-0", "position-1", "position-2", "position-hidden");
    
    // Remove old event listeners by cloning
    const newCard = card.cloneNode(true);
    card.parentNode.replaceChild(newCard, card);
    
    const relativePos = index - currentIndex;
    const car = list[index];
    
    // Add new position class
    if (relativePos < 0) {
      newCard.classList.add("position-hidden");
    } else if (relativePos === 0) {
      newCard.classList.add("position-0");
      if(!car.isAddNew) {
        newCard.tabIndex = 0;
        newCard.addEventListener('click', () => openDetails(car));
        newCard.addEventListener('keydown', e => {if(e.key==='Enter') openDetails(car);});
      } else {
        newCard.addEventListener("click", goToAddCar);
      }
    } else if (relativePos === 1) {
      newCard.classList.add("position-1");
    } else if (relativePos === 2) {
      newCard.classList.add("position-2");
    } else {
      newCard.classList.add("position-hidden");
    }
  });

  // Update arrow visibility
  arrows[0].style.display = currentIndex === 0 ? "none" : "flex";
  arrows[1].style.display = currentIndex === list.length - 1 ? "none" : "flex";
}

function renderTiles(list=filteredCars){
  garageDisplay.className="tiles-view"; garageDisplay.innerHTML="";
  list.forEach(car=>{
    const tile=document.createElement("div"); tile.className="tile-card";
    if(car.isAddNew){ tile.innerHTML=`<div class="car-name">+ Add a new car</div>`; tile.addEventListener("click",goToAddCar);}
    else{ tile.innerHTML=`${car.img?`<img src="${car.img}" alt="${car.name}">`:`<div style="height:150px;display:flex;align-items:center;justify-content:center;color:#bbb">No image</div>`}<div class="tile-info">${car.logo?`<img src="${car.logo}" class="car-logo">`:""}<div class="car-meta"><span class="car-name">${car.brand}</span>${car.model?`<span class="car-model">${car.model}</span>`:""}${car.fuel?`<span class="fuel-pill">${car.fuel}</span>`:""}</div></div>`; tile.dataset.id=car.id; tile.tabIndex=0; tile.style.cursor='pointer'; tile.addEventListener("click",()=>openDetails(car)); tile.addEventListener("keydown",e=>{if(e.key==='Enter') openDetails(car);});}
    garageDisplay.appendChild(tile);
  });
  garageLevel.textContent=`Garage Level - ${list.length-1}`;
}

function renderList(list=filteredCars){
  garageDisplay.className="list-view"; garageDisplay.innerHTML="";
  list.forEach(car=>{
    const item=document.createElement("div"); item.className="list-card";
    if(car.isAddNew){ item.innerHTML=`<div class="car-name">+ Add a new car</div>`; item.addEventListener("click",goToAddCar);}
    else{ item.innerHTML=`${car.logo?`<img src="${car.logo}" class="car-logo">`:""}<div class="car-meta"><span class="car-name">${car.brand}</span>${car.model?`<span class="car-model">${car.model}</span>`:""}${car.fuel?`<span class="fuel-pill">${car.fuel}</span>`:""}</div>`; item.dataset.id=car.id; item.tabIndex=0; item.style.cursor='pointer'; item.addEventListener("click",()=>openDetails(car)); item.addEventListener("keydown",e=>{if(e.key==='Enter') openDetails(car);}); }
    garageDisplay.appendChild(item);
  });
  garageLevel.textContent=`Garage Level - ${list.length-1}`;
}

function renderView(mode){ if(mode==="card") renderCardSlider(); if(mode==="tiles") renderTiles(); if(mode==="list") renderList(); }

searchBox.addEventListener("input",e=>{ const q=e.target.value.toLowerCase(); filteredCars=cars.filter(c=>c.isAddNew||(c.brand||c.name).toLowerCase().includes(q)); currentIndex=0; renderView(viewModeSelect.value); });
viewModeSelect.addEventListener("change",()=>renderView(viewModeSelect.value));
renderView("card");
</script>

<!-- PATCH: additive JS (hide arrows at ends, no-wrap, dots, drag) -->
<script>
(function(){
  var dragBound = false, isDragging = false, dragStartX = 0, dragDeltaX = 0;
  var DRAG_THRESHOLD = 40;

  function getClientX(evt){
    if (evt && evt.touches && evt.touches.length) return evt.touches[0].clientX;
    if (evt && typeof evt.clientX === 'number') return evt.clientX;
    return 0;
  }

  function goToIndex(idx, list){
    list = list || filteredCars;
    if (idx < 0 || idx >= list.length || idx === currentIndex) return;
    currentIndex = idx; renderCardSlider(list);
  }
  function goPrev(list){
    list = list || filteredCars;
    if (currentIndex > 0){ currentIndex--; renderCardSlider(list); }
  }
  function goNext(list){
    list = list || filteredCars;
    if (currentIndex < list.length - 1){ currentIndex++; renderCardSlider(list); }
  }

  var originalRenderCarCard = renderCarCard;

  // Override renderCardSlider to: no wrap, dots, drag, and HIDE arrows at ends
  window.renderCardSlider = function(listParam){
    var list = listParam || filteredCars;

    garageDisplay.className = "carousel-wrapper";
    garageDisplay.innerHTML = "";

    if (list.length === 0 || (list.length === 1 && list[0].isAddNew)) {
      garageDisplay.innerHTML = "<div style='text-align:center;color:#ccc;padding:40px;'>No cars found</div>";
      garageLevel.textContent = "Garage Level - 0";
      return;
    }

    var hasPrev = currentIndex > 0;
    var hasNext = currentIndex < list.length - 1;
    var prevIndex = currentIndex - 1;
    var nextIndex = currentIndex + 1;

    var carousel = document.createElement("div");
    carousel.className = "carousel-track";

    function makeCard(car, position){
      var div = document.createElement("div");
      div.className = "carousel-card " + position;

      if (car.isAddNew) {
        div.innerHTML = '<div class="add-car"><div class="add-plus">+</div><div class="add-text">Add new car</div></div>';
        if (position === "center") div.onclick = function(){ if(!isDragging) goToAddCar(); };
        return div;
      }

      div.innerHTML = originalRenderCarCard(car);
      if (position === "center") {
        div.tabIndex = 0;
        div.onclick = function(){ if(!isDragging) openDetails(car); };
        div.onkeydown = function(e){ if(e.key === "Enter") openDetails(car); };
      }
      return div;
    }

    if (hasPrev) carousel.appendChild(makeCard(list[prevIndex], "left"));
    carousel.appendChild(makeCard(list[currentIndex], "center"));
    if (hasNext) carousel.appendChild(makeCard(list[nextIndex], "right"));

    garageDisplay.appendChild(carousel);

    // Only append visible arrows
    if (hasPrev) {
      var prevBtn = document.createElement("button");
      prevBtn.className = "carousel-btn left";
      prevBtn.innerHTML = "‹";
      prevBtn.onclick = function(){ goPrev(list); };
      garageDisplay.appendChild(prevBtn);
    }

    if (hasNext) {
      var nextBtn = document.createElement("button");
      nextBtn.className = "carousel-btn right";
      nextBtn.innerHTML = "›";
      nextBtn.onclick = function(){ goNext(list); };
      garageDisplay.appendChild(nextBtn);
    }

    // Dots
    var dots = document.createElement("div");
    dots.className = "carousel-dots";
    for (var i=0;i<list.length;i++){
      var dot = document.createElement("button");
      dot.type = "button";
      dot.className = "carousel-dot" + (i === currentIndex ? " active" : "");
      dot.setAttribute("aria-label", "Go to card " + (i+1));
      (function(ii){ dot.onclick = function(){ goToIndex(ii, list); }; })(i);
      dots.appendChild(dot);
    }
    garageDisplay.appendChild(dots);

    garageLevel.textContent = "Garage Level - " + (list.length - 1);

    // Keyboard navigation
    garageDisplay.setAttribute('tabindex','0');
    garageDisplay.onkeydown = function(e){
      if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(list); }
      if (e.key === 'ArrowRight'){ e.preventDefault(); goNext(list); }
    };

    // Drag / swipe bind once
    if (!dragBound) {
      dragBound = true;

      var onDown = function(e){
        isDragging = true;
        dragStartX = getClientX(e);
        dragDeltaX = 0;
        garageDisplay.classList.add('dragging');
      };
      var onMove = function(e){
        if (!isDragging) return;
        var x = getClientX(e);
        dragDeltaX = x - dragStartX;
      };
      var onUp = function(){
        if (!isDragging) return;
        garageDisplay.classList.remove('dragging');
        var delta = dragDeltaX;
        isDragging = false; dragDeltaX = 0;
        if (Math.abs(delta) > DRAG_THRESHOLD) {
          if (delta < 0) goNext(list); else goPrev(list);
        }
      };

      garageDisplay.addEventListener('pointerdown', onDown, {passive:true});
      window.addEventListener('pointermove', onMove, {passive:true});
      window.addEventListener('pointerup', onUp, {passive:true});

      garageDisplay.addEventListener('touchstart', onDown, {passive:true});
      window.addEventListener('touchmove', onMove, {passive:true});
      window.addEventListener('touchend', onUp, {passive:true});
      window.addEventListener('touchcancel', onUp, {passive:true});
    }
  };

  // Re-render to apply the override immediately
  renderView(viewModeSelect.value);
})();
</script>
