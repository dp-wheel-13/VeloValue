<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Garage – VeloValue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --text: #fff;
  --accent: #1db954;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: url('/Multimedia/welcome_to_smart_garage.png') no-repeat center center fixed;
  background-size: cover;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Overlay dim effect */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

/* header */
header {
  display: flex;
  justify-content: space-between; /* left logo/hamburger vs right nav/login */
  align-items: center;
  padding: 1rem 2rem;
  position: fixed;
  width: 100%;
  top: 0;
  background: rgba(0,0,0,0.6);
  z-index: 2000;
  border-bottom: 1px solid #333;
}

/* Left: logo + hamburger stays flex */
.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

/* Right: desktop nav + lang + login aligns to right */
.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}


/* Logo */
header h1 a {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
}

/* Desktop nav */
nav.desktop-nav {
  display: flex;
  gap: 20px;
}
nav.desktop-nav a {
  color: var(--text);
  font-weight: 600;
  font-size: 16px;
  text-decoration: none;
  white-space: nowrap;
}
nav.desktop-nav a:hover {
  text-decoration: underline;
}

/* Language select */
.language-select {
  position: relative;
}
.language-select select {
  appearance: none;
  background: #111;
  color: var(--text);
  border: 1px solid #333;
  border-radius: 6px;
  padding: 6px 30px 6px 10px;
  font-size: 0.9rem;
  cursor: pointer;
}

/* Auth button */
#authSection .text-btn {
  display: inline-flex;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
#authSection .icon-btn {
  display: none;
}

/* Hamburger */
.hamburger {
  font-size: 1.8rem;
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2200;
}

/* Mobile menu */
.menu {
  position: fixed;
  top: 0;
  left: -300px;
  width: 300px;
  height: 100vh;
  background: rgba(17,17,17,0.95);
  border-right: 1px solid rgba(255,255,255,0.12);
  padding: 3rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 2rem;
  transition: left 0.3s ease;
  z-index: 2100;
  backdrop-filter: blur(10px);
  border-radius: 0 1rem 1rem 0;
}
.menu.active { left: 0; }
.menu a {
  color: var(--text);
  font-size: 1.6rem;
  font-weight: 800;
  text-decoration: none;
}

/* Menu overlay */
.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 2050;
}
.menu-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* Responsive header */
@media (max-width: 1024px) {
  nav.desktop-nav { display: none; }
  .hamburger { display: flex; width: 40px; height: 40px; }
}

@media (max-width: 768px) {
  #authSection .text-btn { display: none; }
  #authSection .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.2rem;
    background: var(--text);
    color: var(--bg);
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  #authSection .icon-btn:active { transform: scale(0.95); }

  /* Circular language icon */
  .language-select {
    width: 40px; height: 40px; border-radius: 50%; background: #111; border: 1px solid #fff; display: flex; align-items: center; justify-content: center;
  }
  .language-select::before { content:"🌐"; font-size:1.2rem; color:#fff; position:absolute; }
  .language-select select { opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer; }
}

/* Main garage container */
.garage-container {
  max-width: 600px;
  width: 100%;
  margin: 140px auto 0;
  text-align: center;
  padding: 0 1rem;
}
#welcomeText { font-weight:800; font-size:26px; line-height:1.5; margin-bottom:15px; }
.instruction { font-size:18px; color:#ddd; margin-bottom:30px; }
.italian-plate {
  display: flex;
  align-items: center;
  width: 100%;
  max-width: 500px;
  margin: 0 auto 25px;
  border-radius: 10px;
  background: #fff;
  border: 2px solid #000;
  box-shadow: inset 0 0 10px rgba(91,81,81,0.2), 0 8px 20px rgba(0,0,0,0.6);
  overflow: hidden;
}

.plate-left,
.plate-right {
  flex: 0 0 15%; /* 15% of plate width each */
  min-width: 40px; /* optional minimum width */
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 900;
  font-size: calc(14px + 0.8vw); /* responsive font */
  color: #fff;
  background: #003399;
  height: 90px;
}

.italian-plate input {
  flex: 1 1 auto; /* take remaining space */
  height: 100%;
  border: none;
  outline: none;
  font-size: calc(18px + 0.8vw); /* responsive font */
  font-weight: 900;
  text-align: center;
  letter-spacing: 6px;
  text-transform: uppercase;
  background: transparent;
  color: #000;
  min-width: 60px; /* optional */
}

/* Proceed button width matches plate */
.proceed-btn {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  height: 90px;
  border-radius: 10px;
  font-size: calc(18px + 0.4vw); /* responsive */
  font-weight: 700;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #f2c94c, #f39c12);
  color: #000;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  transition: transform 0.3s, box-shadow 0.3s;
}

.proceed-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.8);
}

/* Smaller screens */
@media (max-width: 768px) {
  .italian-plate {
    height: 70px;
  }
  .plate-left, .plate-right {
    font-size: calc(12px + 1vw);
    min-width: 35px;
  }
  .italian-plate input {
    font-size: calc(16px + 1vw);
  }
  .proceed-btn {
    height: 70px;
    font-size: calc(16px + 0.8vw);
  }
}

</style>
</head>

<body>
<header>
  <div class="header-left">
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <h1><a href="/homepage.html">VeloValue</a></h1>
  </div>

  <div class="header-right">
    <nav class="desktop-nav">
      <a href="/homepage.html">HOME</a>
      <a href="/Explore new cars beta/explorenewcars.html">EXPLORE NEW CARS</a>
      <a href="/Explore smart garage beta/smartgarage.html">SMART GARAGE</a>
      <a href="/Velocharge beta/velocharge.html">VELOCHARGE</a>
    </nav>
    <div class="language-select">
      <select id="languageSelect">
        <option value="en">🇬🇧 English</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </div>
    <div id="authSection">
      <button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>
    </div>
  </div>
</header>

<nav class="menu" id="hamburgerMenu" aria-hidden="true">
  <a href="/homepage.html">HOME</a>
  <a href="/Explore new cars beta/explorenewcars.html">EXPLORE NEW CARS</a>
  <a href="/Explore smart garage beta/smartgarage.html">SMART GARAGE</a>
  <a href="/Velocharge beta/velocharge.html">DISCOVER VELOCHARGE</a>
  <a href="#careers">WORK WITH US</a>
  <a href="#about">ABOUT US</a>
</nav>
<div class="menu-overlay"></div>

<main class="garage-container">
  <h2 id="welcomeText">Hello username,<br>Welcome to Smart Garage</h2>
  <p class="instruction">Please enter your vehicle number to proceed...</p>

  <div class="italian-plate">
    <div class="plate-left">I</div>
    <input type="text" id="numberPlateInput" placeholder="AA 123 AA" maxlength="10">
    <div class="plate-right">EU</div>
  </div>

  <button class="proceed-btn" id="proceedBtn">Proceed →</button>
</main>

<script>
// Hamburger toggle
const hamburger = document.querySelector(".hamburger");
const menu = document.getElementById("hamburgerMenu");
const overlay = document.querySelector(".menu-overlay");

hamburger.addEventListener("click", () => {
  const expanded = hamburger.getAttribute("aria-expanded") === "true";
  hamburger.setAttribute("aria-expanded", !expanded);
  menu.classList.toggle("active");
  overlay.classList.toggle("active");
  menu.setAttribute("aria-hidden", !menu.classList.contains("active"));
});
overlay.addEventListener("click", () => { hamburger.click(); });
window.addEventListener("resize", () => { if(window.innerWidth>1024 && menu.classList.contains("active")) hamburger.click(); });

// Auth button toggle
const authSection = document.getElementById("authSection");
function updateAuthButton() {
  if(window.innerWidth <= 768) {
    authSection.innerHTML = `<button class="icon-btn" onclick="window.location.href='login.html'">👤</button>`;
  } else {
    authSection.innerHTML = `<button class="text-btn" onclick="window.location.href='login.html'">Login / Register</button>`;
  }
}
updateAuthButton();
window.addEventListener("resize", updateAuthButton);

// Load username
async function loadWelcome() {
  try {
    const res = await fetch("/api/user", {credentials:"include"});
    const data = await res.json();
    if(data.loggedIn){
      document.getElementById("welcomeText").innerHTML = `Hello <span style="color:#f2c94c;">${data.username}</span>,<br>Welcome to Smart Garage`;
    }
  } catch(e){}
}
loadWelcome();
</script>

<script src="/js/auth.js"></script>
<script src="/js/translate.js"></script>
</body>
</html>
